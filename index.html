<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CUAN BLOK · Puzzle Penghasil Uang</title>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
  <style>
    /* ===== RESET & GLOBAL ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0a0a0a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100dvh;
      overflow: hidden;
      color: #fff;
    }
    #app {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100dvh;
      max-height: 900px;
      background: radial-gradient(circle at 50% 0%, #2A0808 0%, #1A0000 60%, #0a0a0a 100%);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 60px rgba(0,0,0,0.9);
    }

    /* ===== PARTICLES ===== */
    .particle {
      position: absolute;
      width: 6px; height: 6px;
      background: radial-gradient(circle, #ffd700, #b8860b);
      border-radius: 50%;
      pointer-events: none;
      opacity: 0;
      animation: floatUp 6s linear infinite;
      filter: drop-shadow(0 0 4px #ffd700aa);
      z-index: 1;
    }
    @keyframes floatUp {
      0% { transform: translateY(100dvh) scale(0.5); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.6; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }

    /* ===== ARCADE CONTAINER ===== */
    .arcade {
      position: relative;
      z-index: 2;
      flex: 1;
      display: flex;
      flex-direction: column;
      margin: 8px;
      border-radius: 28px;
      background: rgba(20, 10, 10, 0.55);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 215, 0, 0.25);
      box-shadow: 0 8px 32px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,215,0,0.1);
      overflow: hidden;
    }

    /* ===== HEADER ===== */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: rgba(0,0,0,0.35);
      border-bottom: 1px solid rgba(255,215,0,0.15);
      gap: 6px;
      flex-wrap: wrap;
    }
    .coin-display {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(0,0,0,0.5);
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid rgba(255,215,0,0.3);
    }
    .coin-display svg { width: 22px; height: 22px; }
    .coin-display span { font-weight: 800; font-size: 15px; color: #ffd700; }
    .header-actions {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }
    .header-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,215,0,0.2);
      border-radius: 12px;
      color: #fff;
      font-size: 11px;
      padding: 5px 8px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s;
      white-space: nowrap;
    }
    .header-btn:active { transform: scale(0.94); }
    .header-btn.active { background: rgba(255,215,0,0.25); border-color: #ffd700; }

    /* ===== HEARTS & TICKETS ===== */
    .stats-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 12px 8px;
      font-size: 13px;
      gap: 8px;
      flex-wrap: wrap;
    }
    .hearts { letter-spacing: 2px; font-size: 16px; }
    .hearts .empty { opacity: 0.35; }
    .regen-timer { font-size: 11px; color: #ffd700aa; }

    /* ===== GAME BOARD ===== */
    .board-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 4px 10px;
      position: relative;
    }
    .board {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      width: 100%;
      max-width: 400px;
      aspect-ratio: 1;
      background: rgba(0,0,0,0.3);
      border-radius: 18px;
      padding: 6px;
      border: 1px solid rgba(255,215,0,0.2);
      touch-action: none;
      user-select: none;
    }
    .cell {
      aspect-ratio: 1;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s;
      position: relative;
      box-shadow: inset 0 -3px 0 rgba(0,0,0,0.25);
      will-change: transform;
    }
    .cell:active { transform: scale(0.9); }
    .cell.shake { animation: shake 0.3s ease; }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }
    .cell.pop { animation: popClear 0.25s ease forwards; }
    @keyframes popClear {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.8; }
      100% { transform: scale(0); opacity: 0; }
    }
    .cell .chest-icon {
      font-size: 22px;
      filter: drop-shadow(0 0 6px #ffd700);
      animation: bounce 1s infinite;
    }
    @keyframes bounce {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    /* ===== FLOATING COIN ===== */
    .float-coin {
      position: absolute;
      font-size: 18px;
      font-weight: 900;
      color: #ffd700;
      text-shadow: 0 0 10px #ffd700, 0 0 20px #ff8c00;
      pointer-events: none;
      animation: floatCoin 0.9s ease-out forwards;
      z-index: 50;
    }
    @keyframes floatCoin {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-60px) scale(1.6); }
    }

    /* ===== POWER-UP BAR ===== */
    .powerups {
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 6px 12px 10px;
    }
    .powerup-btn {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,215,0,0.25);
      border-radius: 14px;
      padding: 8px 14px;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: 0.2s;
    }
    .powerup-btn:active { transform: scale(0.93); }
    .powerup-btn .badge {
      background: #ffd700;
      color: #1a0000;
      border-radius: 10px;
      padding: 1px 7px;
      font-size: 11px;
      font-weight: 900;
    }

    /* ===== BOTTOM NAV ===== */
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      padding: 6px 4px 10px;
      background: rgba(0,0,0,0.4);
      border-top: 1px solid rgba(255,215,0,0.15);
    }
    .nav-btn {
      background: none;
      border: none;
      color: #aaa;
      font-size: 11px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 12px;
      transition: 0.2s;
      font-weight: 600;
    }
    .nav-btn.active { color: #ffd700; background: rgba(255,215,0,0.1); }
    .nav-btn .nav-icon { font-size: 18px; }

    /* ===== MODAL ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(6px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: linear-gradient(160deg, #1e293b, #0f172a);
      border: 1px solid rgba(255,215,0,0.35);
      border-radius: 24px;
      padding: 20px;
      width: 100%;
      max-width: 400px;
      max-height: 85dvh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.8);
      position: relative;
    }
    .modal h2 {
      font-size: 18px;
      margin-bottom: 14px;
      color: #ffd700;
      text-align: center;
      letter-spacing: 1px;
    }
    .modal p { font-size: 13px; line-height: 1.5; color: #ccc; margin-bottom: 10px; }
    .modal input, .modal select, .modal textarea {
      width: 100%;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid rgba(255,215,0,0.3);
      background: rgba(0,0,0,0.5);
      color: #fff;
      font-size: 15px;
      margin-bottom: 10px;
      outline: none;
      font-family: inherit;
    }
    .modal input:focus { border-color: #ffd700; }
    .modal .btn {
      width: 100%;
      padding: 13px;
      border-radius: 16px;
      border: none;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 6px;
      letter-spacing: 0.5px;
    }
    .modal .btn:active { transform: scale(0.97); }
    .btn-gold {
      background: linear-gradient(135deg, #ffd700, #ff8c00);
      color: #1a0000;
      box-shadow: 0 4px 20px rgba(255,215,0,0.4);
    }
    .btn-gold:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-outline {
      background: transparent;
      border: 1px solid rgba(255,215,0,0.4);
      color: #ffd700;
    }
    .btn-danger {
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      color: #fff;
    }

    /* ===== WALLET SELECT ===== */
    .wallet-options {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin: 12px 0;
    }
    .wallet-opt {
      flex: 1;
      background: rgba(0,0,0,0.4);
      border: 2px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 10px 6px;
      cursor: pointer;
      text-align: center;
      transition: 0.25s;
    }
    .wallet-opt.selected {
      border-color: #ffd700;
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(255,215,0,0.3);
    }
    .wallet-opt svg { width: 44px; height: 44px; }
    .wallet-opt span { display: block; font-size: 10px; margin-top: 4px; font-weight: 700; }

    /* ===== WD CODE BOX ===== */
    .wd-code-box {
      background: #0a0a0a;
      border: 2px solid #ffd700;
      border-radius: 14px;
      padding: 14px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      word-break: break-all;
      color: #ffd700;
      margin: 12px 0;
      text-align: center;
      line-height: 1.6;
      letter-spacing: 0.5px;
    }

    /* ===== TOAST ===== */
    #toast-container {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
      width: 90%;
      max-width: 380px;
    }
    .toast {
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(255,215,0,0.4);
      border-radius: 14px;
      padding: 10px 16px;
      font-size: 13px;
      color: #fff;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      animation: toastIn 0.3s ease;
      pointer-events: auto;
      font-weight: 600;
    }
    .toast.warn { border-color: #f59e0b; color: #fbbf24; }
    .toast.error { border-color: #ef4444; color: #fca5a5; }
    .toast.success { border-color: #22c55e; color: #86efac; }
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== LOGIN SCREEN ===== */
    .login-screen {
      position: absolute;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px 24px;
      background: radial-gradient(circle at 50% 30%, #2A0808 0%, #1A0000 60%, #0a0a0a 100%);
      text-align: center;
      gap: 10px;
    }
    .login-screen.hidden { display: none; }
    .logo-coin {
      width: 110px;
      height: 110px;
      animation: spinCoin 3s linear infinite;
      filter: drop-shadow(0 0 20px #ffd700aa);
    }
    @keyframes spinCoin {
      0% { transform: rotateY(0deg); }
      100% { transform: rotateY(360deg); }
    }
    .game-title {
      font-size: 34px;
      font-weight: 900;
      background: linear-gradient(135deg, #ffd700, #ff8c00, #ffd700);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 2px;
      text-shadow: 0 0 30px rgba(255,215,0,0.3);
    }
    .game-sub {
      font-size: 12px;
      letter-spacing: 6px;
      color: #ffd700aa;
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    .btn-start {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #fff;
      color: #1a0000;
      border: none;
      border-radius: 60px;
      padding: 16px 40px;
      font-size: 20px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 8px 30px rgba(255,255,255,0.25);
      animation: bounceBtn 1.5s infinite;
      transition: 0.2s;
      margin-top: 10px;
    }
    .btn-start:active { transform: scale(0.95); }
    .btn-start svg { width: 30px; height: 30px; }
    @keyframes bounceBtn {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .login-hint {
      font-size: 11px;
      color: #888;
      margin-top: 16px;
    }

    /* ===== ADMIN STYLES ===== */
    .admin-container {
      position: absolute;
      inset: 0;
      z-index: 200;
      display: none;
      flex-direction: column;
      background: #0f172a;
      overflow: hidden;
    }
    .admin-container.show { display: flex; }
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: #1e293b;
      border-bottom: 1px solid #06b6d4;
      flex-wrap: wrap;
      gap: 8px;
    }
    .admin-header h1 { font-size: 15px; color: #06b6d4; letter-spacing: 1px; }
    .admin-header-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .admin-header-actions button {
      background: #0f172a;
      border: 1px solid #06b6d4;
      color: #06b6d4;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .admin-header-actions button:active { background: #06b6d4; color: #0f172a; }
    .admin-tabs {
      display: flex;
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      overflow-x: auto;
    }
    .admin-tab {
      flex: 1;
      padding: 10px;
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
    }
    .admin-tab.active { color: #06b6d4; border-bottom-color: #06b6d4; }
    .admin-content { flex: 1; overflow-y: auto; padding: 14px; }
    .admin-card {
      background: #1e293b;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      border-left: 3px solid #06b6d4;
    }
    .admin-card .code { font-family: 'Courier New', monospace; font-size: 11px; color: #94a3b8; word-break: break-all; }
    .admin-card .meta { font-size: 12px; color: #cbd5e1; margin-top: 6px; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 800;
      margin-left: 6px;
    }
    .badge.pending { background: #f59e0b; color: #1a0000; }
    .badge.paid { background: #22c55e; color: #052e16; }
    .badge.rejected { background: #ef4444; color: #fff; }
    .admin-actions { display: flex; gap: 6px; margin-top: 8px; }
    .admin-actions button {
      padding: 6px 12px;
      border-radius: 8px;
      border: none;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .admin-actions .pay { background: #22c55e; color: #052e16; }
    .admin-actions .reject { background: #ef4444; color: #fff; }
    .admin-login {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      padding: 30px;
      gap: 14px;
    }
    .admin-login input {
      max-width: 280px;
      text-align: center;
    }

    /* ===== SPIN WHEEL ===== */
    .spin-wheel {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      margin: 10px auto;
      background: conic-gradient(#FF6B6B 0deg 60deg, #4ECDC4 60deg 120deg, #FFE66D 120deg 180deg, #A78BFA 180deg 240deg, #F472B6 240deg 300deg, #34D399 300deg 360deg);
      border: 6px solid #ffd700;
      box-shadow: 0 0 30px rgba(255,215,0,0.4);
      transition: transform 3s cubic-bezier(0.2, 0.8, 0.3, 1);
      position: relative;
    }
    .spin-wheel::after {
      content: '🎯';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 30px;
    }

    /* ===== CHECKIN GRID ===== */
    .checkin-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin: 10px 0;
    }
    .checkin-day {
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,215,0,0.2);
      border-radius: 12px;
      padding: 8px 4px;
      text-align: center;
      font-size: 11px;
    }
    .checkin-day.claimed { background: rgba(34,197,94,0.2); border-color: #22c55e; }
    .checkin-day.today { border-color: #ffd700; box-shadow: 0 0 12px rgba(255,215,0,0.4); }

    /* ===== MISSION LIST ===== */
    .mission-item {
      background: rgba(0,0,0,0.3);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 8px;
      border: 1px solid rgba(255,215,0,0.1);
    }
    .mission-item .mission-title { font-size: 13px; font-weight: 700; margin-bottom: 6px; }
    .mission-progress {
      height: 8px;
      background: rgba(0,0,0,0.5);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 6px;
    }
    .mission-progress .fill {
      height: 100%;
      background: linear-gradient(90deg, #ffd700, #ff8c00);
      border-radius: 4px;
      transition: width 0.4s;
    }
    .mission-claim {
      background: #ffd700;
      color: #1a0000;
      border: none;
      border-radius: 8px;
      padding: 4px 12px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }
    .mission-claim:disabled { opacity: 0.35; cursor: not-allowed; }

    /* ===== LEADERBOARD ===== */
    .lb-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 10px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      font-size: 13px;
    }
    .lb-row .rank { font-weight: 900; color: #ffd700; width: 30px; }
    .lb-row .name { flex: 1; }
    .lb-row .score { font-weight: 700; color: #4ECDC4; }

    /* ===== PROGRESS BAR WD ===== */
    .progress-bar {
      height: 10px;
      background: rgba(0,0,0,0.5);
      border-radius: 5px;
      overflow: hidden;
      margin: 8px 0;
    }
    .progress-bar .fill {
      height: 100%;
      background: linear-gradient(90deg, #ffd700, #ff8c00);
      border-radius: 5px;
      transition: width 0.4s;
    }

    /* ===== FLASH SALE ===== */
    .flash-sale {
      background: linear-gradient(135deg, #ef4444, #f59e0b);
      border-radius: 16px;
      padding: 14px;
      text-align: center;
      margin: 10px 0;
      animation: flashPulse 1s infinite;
    }
    @keyframes flashPulse {
      0%,100% { box-shadow: 0 0 10px rgba(239,68,68,0.5); }
      50% { box-shadow: 0 0 30px rgba(239,68,68,0.9); }
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 360px) {
      .game-title { font-size: 26px; }
      .btn-start { font-size: 17px; padding: 14px 30px; }
      .board { gap: 3px; padding: 4px; }
      .cell { border-radius: 8px; }
    }

    /* ===== SCROLLBAR ===== */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #ffd70044; border-radius: 2px; }
  </style>
</head>
<body>
<div id="app">
  <!-- PARTICLES -->
  <div id="particles"></div>

  <!-- ARCADE CONTAINER -->
  <div class="arcade">

    <!-- HEADER -->
    <div class="header">
      <div class="coin-display">
        <svg viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="44" fill="rgb(252,198,45)" stroke="#b8860b" stroke-width="3"/><circle cx="50" cy="50" r="36" fill="none" stroke="#b8860b" stroke-width="2" stroke-dasharray="6 4"/><text x="50" y="66" font-size="42" text-anchor="middle" fill="rgb(69,86,60)" font-weight="900" font-family="Segoe UI, sans-serif">$</text></svg>
        <span id="coinAmount">0</span>

      fallbackCopy(text);

}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); showToast('📋 Kode dicopy!', 'success'); }
  catch (e) { showToast('❌ Gagal copy', 'error'); }

}

function timeAgo(ts) {
  const diff = Date.now() - ts;
  const m = Math.floor(diff / 60000);
  if (m < 1) return 'baru saja';
  if (m < 60) return m + ' menit lalu';
  const h = Math.floor(m / 60);
  if (h < 24) return h + ' jam lalu';
  return Math.floor(h / 24) + ' hari lalu';
}

/* ============================================================
   6. ANTI-BOT FUNCTIONS
   ============================================================ */
function djb2Hash(str) {
  let hash = 5381;
  for (let i = 0; i < str.length; i++) {
    hash = ((hash << 5) + hash) + str.charCodeAt(i);
    hash = hash & 0xffffffff;
  }
  return Math.abs(hash).toString(36);
}

function getDeviceFingerprint() {
  try {
    const raw = [
      navigator.userAgent,
      navigator.language,
      screen.width + 'x' + screen.height,
      Intl.DateTimeFormat().resolvedOptions().timeZone,
      navigator.hardwareConcurrency || 0,
      navigator.platform || '',
      navigator.deviceMemory || 0,
    ].join('||');
    const hash = djb2Hash(raw);
    return 'dev_' + hash.slice(0, 8);
  } catch (e) {
    return 'dev_fallback';
  }
}

function getDeviceId() {
  try {
    let id = localStorage.getItem(STORAGE.device);
    if (!id) {
      id = getDeviceFingerprint();
      localStorage.setItem(STORAGE.device, id);
    }
    return id;
  } catch (e) {
    return 'dev_nostorage';
  }
}

function getDeviceAccounts() {
  try {
    const raw = localStorage.getItem(STORAGE.accounts);
    if (!raw) return [];
    const data = JSON.parse(raw);
    if (data.sig !== djb2Hash(JSON.stringify(data.accounts))) return [];
    return data.accounts || [];
  } catch (e) { return []; }
}

function saveDeviceAccounts(accounts) {
  try {
    const data = { accounts, sig: djb2Hash(JSON.stringify(accounts)) };
    localStorage.setItem(STORAGE.accounts, JSON.stringify(data));

}

function checkRateLimit() {

  if (recent.length >= 3) {
    showToast('⚠️ Max 3 akun per device per 24 jam', 'warn');
    return false;
  }
  return true;
}

function validateNickname(nick) {
  if (!nick || nick.length < 3 || nick.length > 16) return { ok: false, msg: '3-16 karakter' };
  if (!/^[a-zA-Z0-9_]+$/.test(nick)) return { ok: false, msg: 'Hanya huruf, angka, underscore' };
  if (/^\d+$/.test(nick)) return { ok: false, msg: 'Tidak boleh angka semua' };
  if (/(.)\1{3,}/.test(nick)) return { ok: false, msg: 'Tidak boleh karakter berulang >3x' };
  if (/^bot/i.test(nick)) return { ok: false, msg: 'Nama tidak valid' };
  if (/^user\d+$/i.test(nick)) return { ok: false, msg: 'Nama tidak valid' };
  if (/^test\d+$/i.test(nick)) return { ok: false, msg: 'Nama tidak valid' };
  if (/^admin/i.test(nick)) return { ok: false, msg: 'Nama tidak valid' };
  if (/^null$/i.test(nick)) return { ok: false, msg: 'Nama tidak valid' };
  if (/^guest\d+$/i.test(nick)) return { ok: false, msg: 'Nama tidak valid' };
  return { ok: true, msg: 'OK' };
}

function generateReferral(nickname) {
  const base = nickname.replace(/[^a-zA-Z]/g, '').toUpperCase().slice(0, 4).padEnd(4, 'X');
  const rand = Math.random().toString(36).slice(2, 6).toUpperCase();
  return base + rand;
}

function sfxPop() {

  safeRun(() => {

    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'square';
    o.frequency.value = 520;
    g.gain.setValueAtTime(0.08, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
    o.connect(g).connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + 0.08);
  }, 'sfxPop');
}

function sfxCoin() {
  if (!state.sfxOn || !state.audioCtx) return;

      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'sine';
      o.frequency.value = f;
      g.gain.setValueAtTime(0.06, ctx.currentTime + i * 0.06);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12 + i * 0.06);
      o.connect(g).connect(ctx.destination);
      o.start(ctx.currentTime + i * 0.06);
      o.stop(ctx.currentTime + 0.12 + i * 0.06);
    });
  }, 'sfxCoin');
}

      console.log('[Login] Login ulang: ' + nickname);
      startGame();

    }
  }
  // Akun baru
  if (!checkRateLimit()) return false;
  const refCode = referral || generateReferral(nickname);
  state.player = {
    nickname,
    deviceId,
    referral: refCode,
    coins: 0,
    totalCoinsEarned: 0,
    hearts: MAX_HEARTS,
    lastHeartRegen: Date.now(),
    tickets: MAX_TICKETS,
    lastTicketRegen: Date.now(),
    vipLevel: 0,
    dailySpinDate: '',
    dailyCheckinDate: '',
    checkinStreak: 0,
    hammerCount: 1,
    shuffleCount: 1,
    missions: {},
    missionProgress: {},
    dailyAdCount: 0,
    dailyMultiplierCount: 0,
    lastReviveDate: '',
    lastMysteryChest: 0,
    mysteryChestClaimed: false,
    lastWdDate: '',
    wdQueue: 0,
    totalMatches: 0,
    createdAt: Date.now(),
  };
  accounts.push({ nickname, deviceId, ts: Date.now() });
  saveDeviceAccounts(accounts);
  state.coins = 0;
  state.totalCoinsEarned = 0;
  state.hearts = MAX_HEARTS;
  state.lastHeartRegen = Date.now();
  state.tickets = MAX_TICKETS;
  state.lastTicketRegen = Date.now();
  state.referral = refCode;
  state.vipLevel = 0;
  state.referralCode = refCode;
  savePlayer();
  initMissions();
  showToast('🎉 Akun dibuat! Kode referral: ' + refCode, 'success', 4000);
  console.log('[Login] Akun dibuat: ' + nickname);
  console.log('[Game] Masuk sebagai: ' + nickname + ' | Kode referral: ' + refCode);
  startGame();
  return true;
}

function loadAdminData() {
  try {
    const raw = localStorage.getItem(STORAGE.admin);
    if (!raw) return { pending: [], done: [], sig: '' };
    const data = JSON.parse(raw);
    if (data.sig !== djb2Hash(JSON.stringify({ pending: data.pending, done: data.done }))) {
      return { pending: [], done: [], sig: '' };
    }
    return data;
  } catch (e) { return { pending: [], done: [], sig: '' }; }
}

function saveAdminData(data) {
  try {
    data.sig = djb2Hash(JSON.stringify({ pending: data.pending, done: data.done }));
    localStorage.setItem(STORAGE.admin, JSON.stringify(data));
  } catch (e) { /* ignore */ }
}

function parseWdCode(code) {
  const parts = code.trim().split('|');
  if (parts.length !== 8) return { ok: false, msg: 'Format salah: butuh 8 bagian' };
  if (parts[0] !== 'CB') return { ok: false, msg: 'Prefix harus CB' };
  return {
    ok: true,
    data: {
      nickname: parts[1],
      device6: parts[2],
      amount: parseInt(parts[3], 10) || 0,
      wallet: parts[4],
      phone: parts[5],
      referral: parts[6],
      timestamp: parts[7],
      raw: code.trim(),
      status: 'PENDING',
      parsedAt: Date.now(),
    },
  };
}

function updateVipLevel() {
  let lvl = 0;
  for (const t of VIP_TIERS) {
    if (state.totalCoinsEarned >= t.min) lvl = t.level;
  }
  state.vipLevel = lvl;
  if (dom.btnVip) {
    dom.btnVip.textContent = '👑 VIP ' + lvl;
  }
}

function addCoins(amount, reason) {
  if (amount <= 0) return;
  const bonus = 1 + (VIP_TIERS[state.vipLevel]?.bonus || 0);
  const final = Math.floor(amount * bonus);
  state.coins += final;
  state.totalCoinsEarned += final;
  if (state.player) {
    state.player.coins = state.coins;
    state.player.totalCoinsEarned = state.totalCoinsEarned;
  }
  updateVipLevel();
  updateUI();
  savePlayer();
  if (reason) console.log('[Coin] +' + final + ' (' + reason + ')');
}

function spendCoins(amount) {
  if (state.coins < amount) return false;
  state.coins -= amount;
  if (state.player) state.player.coins = state.coins;
  updateUI();
  savePlayer();
  return true;
}

/* ============================================================
   14. GAMEPLAY (SWIPE MATCH-3)
   ============================================================ */
function generateBoard() {
  state.board = [];
  for (let r = 0; r < BOARD_SIZE; r++) {
    state.board[r] = [];
    for (let c = 0; c < BOARD_SIZE; c++) {
      let color;
      let tries = 0;
      do {
        color = Math.floor(Math.random() * COLORS.length);
        tries++;
      } while (tries < 20 && (
        (c >= 2 && state.board[r][c-1] === color && state.board[r][c-2] === color) ||
        (r >= 2 && state.board[r-1] && state.board[r-1][c] === color && state.board[r-2] && state.board[r-2][c] === color)
      ));
      state.board[r][c] = color;
    }
  }
  // Ensure no matches at start
  let hasMatch = true;
  let iterations = 0;
  while (hasMatch && iterations < 50) {
    hasMatch = false;
    iterations++;
    for (let r = 0; r < BOARD_SIZE; r++) {
      for (let c = 0; c < BOARD_SIZE; c++) {
        if (c >= 2 && state.board[r][c] === state.board[r][c-1] && state.board[r][c] === state.board[r][c-2]) {
          state.board[r][c] = Math.floor(Math.random() * COLORS.length);
          hasMatch = true;
        }
        if (r >= 2 && state.board[r][c] === state.board[r-1][c] && state.board[r][c] === state.board[r-2][c]) {
          state.board[r][c] = Math.floor(Math.random() * COLORS.length);
          hasMatch = true;
        }
      }
    }
  }
  renderBoard();
}

function findMatches() {
  const matched = new Set();
  // Horizontal
  for (let r = 0; r < BOARD_SIZE; r++) {
    let c = 0;
    while (c < BOARD_SIZE) {
      const color = state.board[r][c];
      let len = 1;
      while (c + len < BOARD_SIZE && state.board[r][c + len] === color) len++;
      if (len >= 3) {
        for (let i = 0; i < len; i++) matched.add(r + ',' + (c + i));
      }
      c += len;
    }
  }
  // Vertical
  for (let c = 0; c < BOARD_SIZE; c++) {
    let r = 0;
    while (r < BOARD_SIZE) {
      const color = state.board[r][c];
      let len = 1;
      while (r + len < BOARD_SIZE && state.board[r + len][c] === color) len++;
      if (len >= 3) {
        for (let i = 0; i < len; i++) matched.add((r + i) + ',' + c);
      }
      r += len;
    }
  }
  return matched;
}

function hasMatch() {
  return findMatches().size > 0;
}

function clearMatches() {
  const matched = findMatches();
  if (matched.size === 0) return 0;
  const count = matched.size;
  matched.forEach(key => {
    const [r, c] = key.split(',').map(Number);
    if (state.board[r]) state.board[r][c] = -1;
  });
  // Pop animation
  matched.forEach(key => {
    const [r, c] = key.split(',').map(Number);
    const idx = r * BOARD_SIZE + c;
    const cell = dom.board ? dom.board.children[idx] : null;
    if (cell) cell.classList.add('pop');
  });
  return count;
}

function applyGravity() {
  for (let c = 0; c < BOARD_SIZE; c++) {
    let write = BOARD_SIZE - 1;
    for (let r = BOARD_SIZE - 1; r >= 0; r--) {
      if (state.board[r][c] !== -1) {
        state.board[write][c] = state.board[r][c];
        write--;
      }
    }
    while (write >= 0) {
      state.board[write][c] = Math.floor(Math.random() * COLORS.length);
      write--;
    }
  }
}

function refillBoard() {
  for (let r = 0; r < BOARD_SIZE; r++) {
    for (let c = 0; c < BOARD_SIZE; c++) {
      if (state.board[r][c] === -1) {
        state.board[r][c] = Math.floor(Math.random() * COLORS.length);
      }
    }
  }
}

function processMatches() {
  let totalCleared = 0;
  let iterations = 0;
  while (hasMatch() && iterations < 20) {
    iterations++;
    const cleared = clearMatches();
    totalCleared += cleared;
    safeRun(() => sfxPop(), 'sfxPop');
    vibrate(30);
    applyGravity();
    refillBoard();
  }
  if (totalCleared > 0) {
    const coinPerBlock = 10;
    const bonus = 1 + (VIP_TIERS[state.vipLevel]?.bonus || 0);
    const coins = Math.floor(totalCleared * coinPerBlock * bonus);
    addCoins(coins, 'match');
    state.sessionMatches += totalCleared;
    state.sessionCoins += coins;
    state.totalMatches += totalCleared;
    safeRun(() => sfxCoin(), 'sfxCoin');
    console.log('[Match] ' + totalCleared + ' blok hancur, +' + coins + ' koin');
    // Floating coin effect
    showFloatingCoin('+' + formatNumber(coins));
    // Update missions
    state.missionProgress.clear10 = (state.missionProgress.clear10 || 0) + totalCleared;
    if (state.missionProgress.clear10 >= 10 && !state.missions.claimed?.clear10) {
      // Auto track, claim manually
    }
    updateBoardFromState();
    savePlayer();
  }
  return totalCleared;
}

function showFloatingCoin(text) {
  if (!dom.board) return;
  const el = document.createElement('div');
  el.className = 'float-coin';
  el.textContent = text;
  const rect = dom.board.getBoundingClientRect();
  el.style.left = (rect.left + rect.width / 2 - 30) + 'px';
  el.style.top = (rect.top + rect.height / 2 - 20) + 'px';
  el.style.position = 'fixed';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1000);
}

function attemptSwap(r1, c1, r2, c2) {
  if (r2 < 0 || r2 >= BOARD_SIZE || c2 < 0 || c2 >= BOARD_SIZE) {
    console.log('[Swipe] (' + r1 + ',' + c1 + ') → (' + r2 + ',' + c2 + ') DI LUAR BOARD');
    return false;
  }
  // Swap
  const tmp = state.board[r1][c1];
  state.board[r1][c1] = state.board[r2][c2];
  state.board[r2][c2] = tmp;
  console.log('[Swipe] (' + r1 + ',' + c1 + ') → (' + r2 + ',' + c2 + ')');
  // Check match
  if (hasMatch()) {
    // Valid swap
    updateBoardFromState();
    safeRun(() => sfxClick(), 'sfxClick');
    vibrate(30);
    processMatches();
    return true;
  } else {
    // Invalid swap — revert
    const tmp2 = state.board[r1][c1];
    state.board[r1][c1] = state.board[r2][c2];
    state.board[r2][c2] = tmp2;
    // Shake animation
    const idx1 = r1 * BOARD_SIZE + c1;
    const idx2 = r2 * BOARD_SIZE + c2;
    const cell1 = dom.board ? dom.board.children[idx1] : null;
    const cell2 = dom.board ? dom.board.children[idx2] : null;
    if (cell1) cell1.classList.add('shake');
    if (cell2) cell2.classList.add('shake');
    setTimeout(() => {
      if (cell1) cell1.classList.remove('shake');
      if (cell2) cell2.classList.remove('shake');
    }, 300);
    // Lose heart
    state.hearts = Math.max(0, state.hearts - 1);
    if (state.hearts <= 0) {
      showGameOver();
    }
    safeRun(() => sfxError(), 'sfxError');
    vibrate(60);
    console.log('[Swipe] (' + r1 + ',' + c1 + ') → (' + r2 + ',' + c2 + ') TIDAK MATCH, hati -1');
    updateUI();
    savePlayer();
    return false;
  }
}

function processHeartRegen() {
  const now = Date.now();
  if (state.hearts >= MAX_HEARTS) {
    state.lastHeartRegen = now;
    return;
  }
  const elapsed = now - state.lastHeartRegen;
  const regen = Math.floor(elapsed / HEART_REGEN_MS);
  if (regen > 0) {
    state.hearts = Math.min(MAX_HEARTS, state.hearts + regen);
    state.lastHeartRegen = now;
    showToast('❤️ Hati bertambah!', 'success');
  }
}

function processTicketRegen() {
  const now = Date.now();
  if (state.tickets >= MAX_TICKETS) {
    state.lastTicketRegen = now;
    return;
  }
  const elapsed = now - state.lastTicketRegen;
  const regen = Math.floor(elapsed / TICKET_REGEN_MS);
  if (regen > 0) {
    state.tickets = Math.min(MAX_TICKETS, state.tickets + regen);
    state.lastTicketRegen = now;
  }
}

    }

function showMissionsModal() {

  ];
  let html = '<h2>📋 MISI HARIAN</h2>';
  missions.forEach(m => {
    const progress = state.missionProgress[m.key] || 0;
    const done = progress >= m.target;
    const claimed = state.missions.claimed && state.missions.claimed[m.key];
    const pct = Math.min(100, (progress / m.target) * 100);
    html += `<div class="mission-item">
      <div class="mission-title">${m.label} <span style="color:#ffd700;">+${m.reward} koin</span></div>

        <span style="font-size:11px;color:#888;">${Math.min(progress, m.target)}/${m.target}</span>

      </div>

      const key = btn.dataset.key;
      const m = missions.find(x => x.key === key);

      savePlayer();
      showToast('✅ Misi selesai! +' + m.reward + ' koin', 'success');
      closeModal();
    };
  });
}

      state.lastTickerTime = Date.now();

}

function initEvents() {

      dom.btnSfx.classList.toggle('active', state.sfxOn);
      if (state.sfxOn) safeRun(() => sfxClick(), 'sfxClick');

  if (dom.btnStartLogin) {

        <h2>MASUK</h2>

      const submitBtn = document.getElementById('btnSubmitLogin');

      let tsOk = false;

      startTurnstileTimeout();
      function validate() {
        const nick = nickInput ? nickInput.value.trim() : '';
        const v = validateNickname(nick);
        if (validation) {
          validation.textContent = v.msg;
          validation.style.color = v.ok ? '#22c55e' : '#ef4444';
        }
        if (submitBtn) submitBtn.disabled = !(v.ok && (tsOk || state.turnstileBypassed));

        submitBtn.onclick = () => {

      state.hammerMode = true;
      showToast('🔨 Klik blok yang ingin dihancurkan', 'info');

        if (spendCoins(500)) { state.shuffleCount++; showToast('🔀 Shuffle dibeli!', 'success'); }
        else { showToast('❌ Koin tidak cukup', 'error'); return; }
      }
      state.shuffleCount--;
      state.board = [];
      generateBoard();
      safeRun(() => sfxWin(), 'sfxWin');
      showToast('🔀 Board diacak!', 'success');
      updateUI();
    };
  }
  // Admin login
  if (dom.btnAdminLogin) {
    dom.btnAdminLogin.onclick = () => {
      const pass = dom.adminPass ? dom.adminPass.value : '';
      if (pass === ADMIN_PASS_DEFAULT) {
        state.adminAuthed = true;
        showAdminDashboard();
        showToast('🔐 Admin masuk', 'success');
      } else {
        showToast('❌ Password salah', 'error');
      }
    };

  if (dom.btnAdminBack) {

      window.location.hash = '';
      location.reload();
    };
  }
  if (dom.btnAdminLogout) {
    dom.btnAdminLogout.onclick = () => {
      state.adminAuthed = false;
      showAdminLogin();
      showToast('🚪 Logout', 'info');
    };
  }
  if (dom.btnExport) dom.btnExport.onclick = exportAdminJson;
  if (dom.btnImport) dom.btnImport.onclick = () => dom.importFile && dom.importFile.click();
  if (dom.importFile) {
    dom.importFile.onchange = (e) => {
      if (e.target.files && e.target.files[0]) importAdminJson(e.target.files[0]);
    };
  }
  // Modal close on overlay click
  if (dom.modalOverlay) {
    dom.modalOverlay.onclick = (e) => {
      if (e.target === dom.modalOverlay) {
        // Don't close if game over or WD
        if (state.gameOverModal) return;
        closeModal();
      }
    };
  }
  // Exit intent
  document.addEventListener('mouseleave', (e) => {
    if (e.clientY < 10 && !state.gameOverModal) {
      showToast('🎁 Tunggu! Dapat +500 koin jika tetap di sini!', 'warn', 4000);
      addCoins(500, 'exit-intent');
    }
  });
  // Swipe gesture on board
  if (dom.board) {
    dom.board.addEventListener('pointerdown', (e) => {
      const cell = e.target.closest('.cell');
      if (!cell) return;
      const r = parseInt(cell.dataset.r, 10);
      const c = parseInt(cell.dataset.c, 10);
      if (isNaN(r) || isNaN(c)) return;
      if (state.hammerMode) {
        state.hammerMode = false;
        state.hammerCount--;
        state.board[r][c] = -1;
        applyGravity();
        refillBoard();
        updateBoardFromState();
        safeRun(() => sfxPop(), 'sfxPop');
        showToast('🔨 Blok dihancurkan!', 'success');
        updateUI();
        savePlayer();
        return;
      }
      if (cell.dataset.chest === '1') {
        cell.dataset.chest = '';
        cell.innerHTML = '';
        state.mysteryChestClaimed = true;
        state.lastMysteryChest = Date.now();
        const rewards = ['coins', 'ticket', 'hammer', 'shuffle'];
        const pick = rewards[Math.floor(Math.random() * rewards.length)];
        if (pick === 'coins') { addCoins(500, 'chest'); showToast('🎁 Dapat 500 koin!', 'success'); }
        else if (pick === 'ticket') { state.tickets = Math.min(MAX_TICKETS, state.tickets + 1); showToast('🎁 Dapat 1 tiket!', 'success'); }
        else if (pick === 'hammer') { state.hammerCount++; showToast('🎁 Dapat 1 Hammer!', 'success'); }
        else { state.shuffleCount++; showToast('🎁 Dapat 1 Shuffle!', 'success'); }
        safeRun(() => sfxWin(), 'sfxWin');
        updateUI();
        savePlayer();
        return;
      }
      state.swipe = { active: true, startR: r, startC: c, startX: e.clientX, startY: e.clientY };
      e.preventDefault();
    }, { passive: false });
    dom.board.addEventListener('pointermove', (e) => {
      if (!state.swipe.active) return;
      e.preventDefault();
    }, { passive: false });
    dom.board.addEventListener('pointerup', (e) => {
      if (!state.swipe.active) return;
      const { startR, startC, startX, startY } = state.swipe;
      state.swipe.active = false;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      let targetR = startR, targetC = startC;
      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 20) {
        targetC = dx > 0 ? startC + 1 : startC - 1;
      } else if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 20) {
        targetR = dy > 0 ? startR + 1 : startR - 1;
      } else {
        return;
      }
      attemptSwap(startR, startC, targetR, targetC);
    });
    dom.board.addEventListener('pointercancel', () => { state.swipe.active = false; });
    dom.board.addEventListener('pointerleave', () => { state.swipe.active = false; });
  }
}

/* ============================================================
   21. INIT
   ============================================================ */
function startGame() {
  if (dom.loginScreen) dom.loginScreen.classList.add('hidden');
  if (dom.adminContainer) dom.adminContainer.classList.remove('show');
  state.deviceId = getDeviceId();
  console.log('[Device] ID: ' + state.deviceId);
  if (state.player) {
    restorePlayerState();
    state.referralCode = state.player.referral;
  }
  generateBoard();
  updateUI();
  initNav();
  initEvents();
  startTicker();
  if (state.bgmOn) playBgm();
  console.log('[Game] Masuk sebagai: ' + (state.player ? state.player.nickname : 'Guest') + ' | Kode referral: ' + state.referralCode);
}

function init() {
  console.log('[Init] Mulai...');
  safeRun(() => {
    loadSettings();
    createParticles();
    state.deviceId = getDeviceId();
    console.log('[Device] ID: ' + state.deviceId);
    // Check hash
    if (window.location.hash === ADMIN_HASH) {
      console.log('[Mode] Admin mode');
      state.isAdmin = true;
      if (dom.loginScreen) dom.loginScreen.classList.add('hidden');
      if (dom.adminContainer) dom.adminContainer.classList.add('show');
      showAdminLogin();
      initAdminTabs();
      // Admin events
      if (dom.btnAdminLogin) dom.btnAdminLogin.onclick = () => {
        const pass = dom.adminPass ? dom.adminPass.value : '';
        if (pass === ADMIN_PASS_DEFAULT) {
          state.adminAuthed = true;
          showAdminDashboard();
        } else showToast('❌ Password salah', 'error');
      };
      if (dom.btnAdminBack) dom.btnAdminBack.onclick = () => { window.location.hash = ''; location.reload(); };
      if (dom.btnAdminLogout) dom.btnAdminLogout.onclick = () => { state.adminAuthed = false; showAdminLogin(); };
      if (dom.btnExport) dom.btnExport.onclick = exportAdminJson;
      if (dom.btnImport) dom.btnImport.onclick = () => dom.importFile && dom.importFile.click();
      if (dom.importFile) dom.importFile.onchange = (e) => { if (e.target.files[0]) importAdminJson(e.target.files[0]); };
      return;
    }
    console.log('[Mode] Player mode');
    // Check existing player
    const existing = loadPlayer();
    if (existing) {
      state.player = existing;
      restorePlayerState();
      startGame();
    } else {
      // Show login
      if (dom.loginScreen) dom.loginScreen.classList.remove('hidden');
      if (dom.btnStartLogin) {
        dom.btnStartLogin.onclick = () => {
          initAudio();
          safeRun(() => sfxClick(), 'sfxClick');
          openModal(`
            <h2>MASUK</h2>
            <input type="text" id="nicknameInput" placeholder="Nickname (3-16 karakter)" maxlength="16" autocomplete="off">
            <div id="nickValidation" style="font-size:11px;margin-bottom:6px;"></div>
            <div id="loginTurnstile"></div>
            <button class="btn btn-gold" id="btnSubmitLogin" disabled>MULAI MAIN</button>
            <button class="btn btn-outline" id="btnCloseLogin" style="margin-top:6px;">Batal</button>
          `);
          const nickInput = document.getElementById('nicknameInput');
          const validation = document.getElementById('nickValidation');
          const submitBtn = document.getElementById('btnSubmitLogin');
          const closeBtn = document.getElementById('btnCloseLogin');
          let tsOk = false;
          let loginStart = Date.now();
          renderTurnstileWidget('loginTurnstile', () => { tsOk = true; validate(); });
          startTurnstileTimeout();
          function validate() {
            const nick = nickInput ? nickInput.value.trim() : '';
            const v = validateNickname(nick);
            if (validation) {
              validation.textContent = v.msg;
              validation.style.color = v.ok ? '#22c55e' : '#ef4444';
            }
            if (submitBtn) submitBtn.disabled = !(v.ok && (tsOk || state.turnstileBypassed));
          }
          if (nickInput) nickInput.oninput = validate;
          if (submitBtn) {
            submitBtn.onclick = () => {
              const nick = nickInput ? nickInput.value.trim() : '';
              const v = validateNickname(nick);
              if (!v.ok) { showToast('❌ ' + v.msg, 'error'); return; }
              if (Date.now() - loginStart < 800) { showToast('⏳ Terlalu cepat', 'warn'); return; }
              if (!state.turnstileToken && !state.turnstileBypassed) { showToast('❌ Verifikasi Turnstile', 'error'); return; }
              closeModal();
              processLogin(nick);
            };
          }
          if (closeBtn) closeBtn.onclick = () => closeModal();
        };
      }
    }
    // Global click to init audio
    document.addEventListener('click', function once() {
      initAudio();
      document.removeEventListener('click', once);
    }, { once: true });
  }, 'init');
}

// Jalankan init
window.addEventListener('load', () => safeRun(init, 'init'));
window.CuanBlok = { state, updateUI, showToast };
</script>
