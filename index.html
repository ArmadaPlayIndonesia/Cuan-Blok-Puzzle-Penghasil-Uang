<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CUAN BLOK · Puzzle Penghasil Uang</title>
  <!-- Supabase JS (publishable key only, no secret) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* === RESET & GLOBAL === */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
      background: #0a0a0a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100dvh;
      overflow: hidden;
      color: #fff;
      user-select: none;
    }

    /* === BACKGROUND GRADIENT & PARTIKEL === */
    .bg-gradient {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 30% 10%, #2A0808 0%, #1A0000 40%, #0a0a0a 100%);
      z-index: 0;
    }

    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 6px;
      height: 6px;
      background: radial-gradient(circle, #FFD966, #b8860b);
      border-radius: 50%;
      filter: drop-shadow(0 0 6px #ffd700aa);
      opacity: 0.5;
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      0% { transform: translateY(100vh) scale(0.8); opacity: 0; }
      15% { opacity: 0.8; }
      85% { opacity: 0.6; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }

    /* === ARCADE CONTAINER === */
    .arcade {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100dvh;
      max-height: 100dvh;
      background: rgba(20, 8, 8, 0.72);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 215, 0, 0.35);
      border-radius: 28px;
      box-shadow: 0 0 60px rgba(255, 215, 0, 0.08), inset 0 0 60px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 2;
      margin: 0 auto;
    }

    /* === SCREENS === */
    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      transition: opacity 0.4s ease, transform 0.4s ease;
      background: transparent;
    }

    .screen.hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.98);
    }

    /* === LOGIN SCREEN === */
    #loginScreen {
      justify-content: center;
      align-items: center;
      padding: 32px 24px;
      text-align: center;
      z-index: 10;
    }

    .logo-coin {
      width: 110px;
      height: 110px;
      margin-bottom: 18px;
      animation: spin 8s linear infinite;
      filter: drop-shadow(0 0 20px #ffd70088);
    }

    @keyframes spin {
      0% { transform: rotateY(0deg); }
      100% { transform: rotateY(360deg); }
    }

    .game-title {
      font-size: 2.1rem;
      font-weight: 900;
      background: linear-gradient(180deg, #FFE484, #FFB800, #b8860b);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: 2px;
      text-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
      margin-bottom: 4px;
      line-height: 1.1;
    }

    .game-sub {
      font-size: 0.85rem;
      color: #bbaa88;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    .btn-google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #fff;
      color: #222;
      border: none;
      border-radius: 60px;
      padding: 16px 28px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      transition: transform 0.2s, box-shadow 0.3s, background 0.2s;
      width: 100%;
      max-width: 320px;
      animation: bounce 2.5s infinite;
      position: relative;
      z-index: 11;
    }

    .btn-google:active {
      transform: scale(0.96);
      background: #e8e8e8;
    }

    .btn-google:disabled {
      opacity: 0.8;
      background: #444;
      color: #aaa;
      animation: none;
      cursor: not-allowed;
      transform: none;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .login-hint {
      margin-top: 22px;
      font-size: 0.75rem;
      color: #887766;
    }

    /* === HEADER (in-game) === */
    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px 8px;
      border-bottom: 1px solid rgba(255, 215, 0, 0.15);
      flex-wrap: wrap;
      gap: 6px;
      background: rgba(10, 0, 0, 0.4);
      backdrop-filter: blur(6px);
    }

    .coin-display {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: 1.2rem;
      color: #FFD966;
      text-shadow: 0 0 12px #ffd70055;
    }

    .coin-display svg {
      width: 26px;
      height: 26px;
    }

    .hearts-display {
      display: flex;
      gap: 4px;
      font-size: 1.2rem;
      align-items: center;
    }

    .toggle-group {
      display: flex;
      gap: 6px;
    }

    .toggle-btn {
      background: rgba(255, 215, 0, 0.1);
      border: 1px solid rgba(255, 215, 0, 0.3);
      color: #ffd966;
      border-radius: 40px;
      padding: 4px 10px;
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      white-space: nowrap;
    }

    .toggle-btn.off {
      background: rgba(80, 80, 80, 0.3);
      border-color: #555;
      color: #888;
    }

    .toggle-btn:active {
      transform: scale(0.92);
    }

    /* === LIVE TICKER === */
    .live-ticker {
      padding: 6px 14px;
      font-size: 0.72rem;
      background: rgba(255, 215, 0, 0.08);
      border-bottom: 1px solid rgba(255, 215, 0, 0.1);
      color: #eedd99;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-height: 30px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.3s;
    }

    /* === GAME BOARD === */
    .board-wrapper {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 6px 8px;
      min-height: 0;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
      width: 100%;
      max-width: 420px;
      aspect-ratio: 1/1;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 20px;
      padding: 8px;
      border: 1px solid rgba(255, 215, 0, 0.15);
      box-shadow: inset 0 0 30px rgba(0,0,0,0.6);
    }

    .cell {
      background: rgba(255, 255, 255, 0.04);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.15s, background 0.15s;
      aspect-ratio: 1/1;
      font-size: 1.6rem;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.06);
      will-change: transform;
    }

    .cell:active {
      transform: scale(0.9);
    }

    .cell.selected {
      box-shadow: 0 0 16px #ffd700, 0 0 30px #ffd70066;
      border: 1px solid #ffd700;
      z-index: 2;
    }

    .cell.pop {
      animation: popClear 0.3s ease-out forwards;
    }

    @keyframes popClear {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.9; }
      100% { transform: scale(0); opacity: 0; }
    }

    .floating-coin {
      position: absolute;
      font-weight: 800;
      font-size: 0.9rem;
      color: #FFD966;
      text-shadow: 0 0 12px #ffd700;
      pointer-events: none;
      animation: floatCoin 1s ease-out forwards;
      z-index: 50;
    }

    @keyframes floatCoin {
      0% { opacity: 1; transform: translateY(0) scale(0.8); }
      100% { opacity: 0; transform: translateY(-48px) scale(1.3); }
    }

    /* === BOTTOM NAV === */
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      padding: 8px 6px 12px;
      background: rgba(10, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      border-top: 1px solid rgba(255, 215, 0, 0.15);
    }

    .nav-btn {
      background: none;
      border: none;
      color: #bbaa88;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      font-size: 0.6rem;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 10px;
      border-radius: 14px;
      transition: 0.2s;
      letter-spacing: 0.3px;
    }

    .nav-btn.active {
      color: #FFD966;
      background: rgba(255, 215, 0, 0.1);
      text-shadow: 0 0 12px #ffd70055;
    }

    .nav-btn .icon {
      font-size: 1.3rem;
      line-height: 1;
    }

    /* === TOAST === */
    .toast-container {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
      width: 90%;
      max-width: 400px;
    }

    .toast {
      background: rgba(30, 20, 10, 0.95);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 215, 0, 0.4);
      color: #fff;
      padding: 12px 20px;
      border-radius: 40px;
      font-size: 0.85rem;
      font-weight: 500;
      box-shadow: 0 8px 30px rgba(0,0,0,0.7);
      animation: toastIn 0.3s ease-out;
      text-align: center;
      pointer-events: auto;
      max-width: 100%;
      word-break: break-word;
    }

    @keyframes toastIn {
      0% { opacity: 0; transform: translateY(-16px) scale(0.94); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .toast.fade-out {
      animation: toastOut 0.3s ease-in forwards;
    }

    @keyframes toastOut {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-20px); }
    }

    /* === MODAL === */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 5000;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      background: linear-gradient(145deg, #1f0f0f, #0d0505);
      border: 1px solid rgba(255, 215, 0, 0.4);
      border-radius: 28px;
      padding: 24px 20px;
      max-width: 360px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.8);
      transform: scale(0.9);
      transition: transform 0.3s;
    }

    .modal-overlay.active .modal-box {
      transform: scale(1);
    }

    .modal-box h3 {
      color: #FFD966;
      font-size: 1.3rem;
      margin-bottom: 12px;
      font-weight: 800;
    }

    .modal-box p {
      color: #ccbbaa;
      font-size: 0.9rem;
      margin-bottom: 18px;
      line-height: 1.5;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      background: linear-gradient(180deg, #FFD966, #cc9900);
      border: none;
      border-radius: 40px;
      padding: 12px 22px;
      font-weight: 700;
      color: #1a0a00;
      cursor: pointer;
      font-size: 0.9rem;
      transition: 0.2s;
      box-shadow: 0 4px 16px rgba(255, 215, 0, 0.2);
      min-width: 100px;
    }

    .btn:active {
      transform: scale(0.94);
    }

    .btn.secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #ddccaa;
      border: 1px solid rgba(255, 215, 0, 0.2);
      box-shadow: none;
    }

    .btn:disabled {
      opacity: 0.5;
      pointer-events: none;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      overflow: hidden;
      margin: 12px 0;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #FFD966, #ffaa00);
      width: 0%;
      transition: width 0.1s linear;
    }

    /* === SPIN WHEEL (simple) === */
    .spin-wheel {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: conic-gradient(#FFD966 0deg 60deg, #cc9900 60deg 120deg, #FFD966 120deg 180deg, #cc9900 180deg 240deg, #FFD966 240deg 300deg, #cc9900 300deg 360deg);
      margin: 10px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      position: relative;
      box-shadow: 0 0 40px #ffd70055;
      transition: transform 2s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .spin-wheel::after {
      content: '🎯';
      position: absolute;
      font-size: 2rem;
    }

    /* === RANKING LIST === */
    .ranking-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 14px;
    }

    .rank-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 14px;
      background: rgba(255, 215, 0, 0.04);
      border-radius: 14px;
      margin-bottom: 6px;
      font-size: 0.85rem;
      border: 1px solid rgba(255, 215, 0, 0.08);
      color: #eeddcc;
    }

    .rank-item .medal {
      font-size: 1.1rem;
    }

    /* === UTILS === */
    .text-gold { color: #FFD966; }
    .text-sm { font-size: 0.75rem; }
    .mt-2 { margin-top: 8px; }
    .mb-2 { margin-bottom: 8px; }
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .items-center { align-items: center; }
    .justify-center { justify-content: center; }
    .gap-2 { gap: 8px; }
    .p-2 { padding: 8px; }

    .hidden { display: none !important; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #ffd70055; border-radius: 20px; }
  </style>
</head>

    function showToast(msg, duration = 2800) {
      if (!dom.toastContainer) return;

      dom.toastContainer.appendChild(t);

    function vibrate(ms = 30) {

    function formatNumber(n) {

    // ============================================================
    // [8] AUDIO
    // ============================================================
    function initAudio() {
      if (state.audioCtx) return;
      try {
        state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        console.log('[Audio] AudioContext dibuat');
      } catch (e) {
        console.warn('[Audio] Gagal:', e.message);
      }
    }

    function playTone(freq, duration, type = 'sine', vol = 0.15) {
      if (!state.audioCtx || !state.sfxEnabled) return;
      try {
        const osc = state.audioCtx.createOscillator();
        const gain = state.audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(vol, state.audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, state.audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(state.audioCtx.destination);
        osc.start();
        osc.stop(state.audioCtx.currentTime + duration);
      } catch (e) { /* silent */ }
    }

    function playSFX(name) {
      if (!state.audioCtx || !state.sfxEnabled) return;
      const map = {
        pop: [520, 0.12, 'square', 0.1],
        coin: [880, 0.15, 'sine', 0.12],
        error: [180, 0.25, 'sawtooth', 0.08],
        win: [660, 0.2, 'sine', 0.15],
        click: [400, 0.06, 'sine', 0.06],
        spin: [300, 0.3, 'triangle', 0.08],
      };
      const p = map[name] || map.click;
      playTone(p[0], p[1], p[2], p[3]);
    }

    function startBGM() {
      if (!state.audioCtx || !state.bgmEnabled || state.bgmOsc) return;
      try {
        const gain = state.audioCtx.createGain();
        gain.gain.value = 0.04;
        gain.connect(state.audioCtx.destination);
        const notes = [262, 330, 392, 330, 262, 294, 330, 294];
        let i = 0;
        state.bgmInterval = setInterval(() => {
          if (!state.bgmEnabled || !state.audioCtx) return;
          const osc = state.audioCtx.createOscillator();
          const g = state.audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.value = notes[i % notes.length];
          g.gain.setValueAtTime(0.04, state.audioCtx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.001, state.audioCtx.currentTime + 0.6);
          osc.connect(g);
          g.connect(state.audioCtx.destination);
          osc.start();
          osc.stop(state.audioCtx.currentTime + 0.6);
          i++;
        }, 620);
        state.bgmGain = gain;
      } catch (e) { console.warn('[BGM]', e.message); }
    }

    function stopBGM() {
      if (state.bgmInterval) {
        clearInterval(state.bgmInterval);
        state.bgmInterval = null;
      }
      state.bgmOsc = null;
    }

    function handleLogin() {
      console.log('[Login] Tombol ditekan');

      // [A] Lapis 1 — Feedback instan
      dom.loginBtn.disabled = true;
      dom.loginBtnText.textContent = '⏳ Menghubungkan...';
      dom.loginBtn.style.background = '#333';
      dom.loginBtn.style.color = '#aaa';

      // [G] Audio hanya di event listener user
      initAudio();
      playSFX('click');

      // [A] Lapis 3 — fallback total
      if (!supabase) {
        console.warn('[Login] Supabase null → demoLogin');
        setTimeout(demoLogin, 400);
        return;
      }

      // [A] Lapis 2 — timeout 3 detik
      if (state.loginTimeout) clearTimeout(state.loginTimeout);
      state.loginTimeout = setTimeout(() => {
        console.warn('[Login] Timeout 3s → demoLogin');
        demoLogin();
      }, 3000);

      // Coba signInWithOAuth
      (async () => {
        try {
          const { data, error } = await supabase.auth.signInWithOAuth({

              redirectTo: window.location.origin + window.location.pathname,

        } catch (err) {
          console.warn('[Login] OAuth error:', err.message);

          showToast('⚠️ Login gagal, mode demo aktif');
          setTimeout(demoLogin, 800);

      })();

      console.log('[Login] Demo Mode aktif');

    async function checkSession() {
      try {
        if (!supabase) return null;
        const { data: { session } } = await supabase.auth.getSession();

      } catch (e) {
        console.warn('[Auth] Session check gagal:', e.message);

      }

    function handleOAuthCallback() {
      const hash = window.location.hash || '';
      const search = window.location.search || '';
      const hasToken = hash.includes('access_token=') || search.includes('code=');
      if (!hasToken) return false;

      console.log('[OAuth] Callback terdeteksi');
      setTimeout(async () => {
        const session = await checkSession();
        if (session && session.user) {
          console.log('[OAuth] Session ditemukan:', session.user.email);
          state.user = session.user;
          enterGame();
        }
        history.replaceState(null, '', window.location.pathname);
      }, 500);
      return true;

    // ============================================================
    // [12] GAMEPLAY
    // ============================================================
    function generateBoard() {
      state.board = [];
      for (let r = 0; r < state.boardSize; r++) {
        const row = [];
        for (let c = 0; c < state.boardSize; c++) {
          row.push(Math.floor(Math.random() * COLORS.length));
        }
        state.board.push(row);
      }
      // Pastikan tidak ada match instan di awal
      let guard = 0;
      while (findAllMatches().length > 0 && guard < 100) {
        for (let r = 0; r < state.boardSize; r++) {
          for (let c = 0; c < state.boardSize; c++) {
            if (findAllMatches().some(m => m.r === r && m.c === c)) {
              state.board[r][c] = Math.floor(Math.random() * COLORS.length);
            }
          }
        }
        guard++;
      }
    }

    function renderBoard() {
      if (!dom.board) return;
      dom.board.innerHTML = '';
      for (let r = 0; r < state.boardSize; r++) {
        for (let c = 0; c < state.boardSize; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          const val = state.board[r]?.[c];
          if (val !== undefined && val !== null) {
            cell.style.background = COLORS[val];
            cell.style.boxShadow = `inset 0 0 12px ${COLORS[val]}44`;
          }
          cell.dataset.r = r;
          cell.dataset.c = c;
          if (state.selected.some(s => s.r === r && s.c === c)) {
            cell.classList.add('selected');
          }
          cell.addEventListener('click', () => handleCellClick(r, c));
          dom.board.appendChild(cell);
        }
      }
    }

    function handleCellClick(r, c) {
      if (state.hearts <= 0) {
        showToast('❤️ Hati habis! Tunggu cooldown atau tonton iklan');
        return;
      }
      const idx = state.selected.findIndex(s => s.r === r && s.c === c);
      if (idx >= 0) {
        state.selected.splice(idx, 1);
      } else {
        // Cek adjacency dengan selected terakhir
        if (state.selected.length > 0) {
          const last = state.selected[state.selected.length - 1];
          const adj = Math.abs(last.r - r) + Math.abs(last.c - c) === 1;
          if (!adj) {
            // Reset jika tidak adjacent
            state.selected = [];
            state.selected.push({ r, c });
          } else {
            const valLast = state.board[last.r][last.c];
            const valCur = state.board[r][c];
            if (valLast !== valCur) {
              state.selected = [];
              state.selected.push({ r, c });
            } else {
              state.selected.push({ r, c });
            }
          }
        } else {
          state.selected.push({ r, c });
        }
      }

      // Jika 3+ selected, clear
      if (state.selected.length >= 3) {
        clearSelected();
      } else {
        renderBoard();
        vibrate(10);
        playSFX('click');
      }
    }

    function clearSelected() {
      if (state.selected.length < 3) return;
      const count = state.selected.length;
      let earned = count * 10;
      if (state.vipTier > 0) earned = Math.floor(earned * (1 + state.vipTier * 0.1));
      state.coins += earned;
      playSFX('coin');
      vibrate(30);

      // Floating coin effect
      const first = state.selected[0];
      const boardRect = dom.board?.getBoundingClientRect();
      if (boardRect && dom.board) {
        const cellSize = boardRect.width / state.boardSize;
        const fx = boardRect.left + first.c * cellSize + cellSize / 2;
        const fy = boardRect.top + first.r * cellSize + cellSize / 2;
        const float = document.createElement('div');
        float.className = 'floating-coin';
        float.textContent = `+${earned}`;
        float.style.position = 'fixed';
        float.style.left = fx + 'px';
        float.style.top = fy + 'px';
        float.style.transform = 'translate(-50%,-50%)';
        document.body.appendChild(float);
        setTimeout(() => float.remove(), 1000);
      }

      // Animasi pop
      state.selected.forEach(s => {
        const cellEl = dom.board?.querySelector(`.cell[data-r="${s.r}"][data-c="${s.c}"]`);
        if (cellEl) cellEl.classList.add('pop');
      });

      // Hapus dari board
      state.selected.forEach(s => {
        if (state.board[s.r] && state.board[s.r][s.c] !== null) {
          state.board[s.r][s.c] = null;
        }
      });

      state.selected = [];

      setTimeout(() => {
        applyGravity();
        refillBoard();
        autoClearMatches();
        renderBoard();
        updateUI();
      }, 320);
    }

    function applyGravity() {
      for (let c = 0; c < state.boardSize; c++) {
        let writeRow = state.boardSize - 1;
        for (let r = state.boardSize - 1; r >= 0; r--) {
          if (state.board[r][c] !== null && state.board[r][c] !== undefined) {
            state.board[writeRow][c] = state.board[r][c];
            writeRow--;
          }
        }
        for (let r = writeRow; r >= 0; r--) {
          state.board[r][c] = null;
        }
      }
    }

    function refillBoard() {
      for (let r = 0; r < state.boardSize; r++) {
        for (let c = 0; c < state.boardSize; c++) {
          if (state.board[r][c] === null || state.board[r][c] === undefined) {
            state.board[r][c] = Math.floor(Math.random() * COLORS.length);
          }
        }
      }
    }

    function findAllMatches() {
      const matches = [];
      // Horizontal
      for (let r = 0; r < state.boardSize; r++) {
        for (let c = 0; c < state.boardSize - 2; c++) {
          const v = state.board[r]?.[c];
          if (v === null || v === undefined) continue;
          if (state.board[r][c + 1] === v && state.board[r][c + 2] === v) {
            matches.push({ r, c }, { r, c: c + 1 }, { r, c: c + 2 });
          }
        }
      }
      // Vertikal
      for (let c = 0; c < state.boardSize; c++) {
        for (let r = 0; r < state.boardSize - 2; r++) {
          const v = state.board[r]?.[c];
          if (v === null || v === undefined) continue;
          if (state.board[r + 1]?.[c] === v && state.board[r + 2]?.[c] === v) {
            matches.push({ r, c }, { r: r + 1, c }, { r: r + 2, c });
          }
        }
      }
      return matches;
    }

    function autoClearMatches() {
      let guard = 0;
      while (findAllMatches().length > 0 && guard < 30) {
        const matches = findAllMatches();
        const unique = [...new Map(matches.map(m => [`${m.r},${m.c}`, m])).values()];
        unique.forEach(m => {
          if (state.board[m.r] && state.board[m.r][m.c] !== null) {
            state.board[m.r][m.c] = null;
          }
        });
        applyGravity();
        refillBoard();
        guard++;
      }
    }

      if (state.lastCheckin === today) {
        showToast('📅 Sudah check-in hari ini!');

      }
      state.checkinStreak = (state.checkinStreak || 0) + 1;

      playSFX('win');

      closeModal();

        onConfirm: () => {
          if (state.coins < 50) { showToast('Koin tidak cukup'); return; }

          }

      if (!state.powerups.shuffle) { showToast('🔄 Shuffle habis'); return; }
      state.powerups.shuffle--;
      generateBoard();

      showToast('🔄 Board di-shuffle!');

      });

        p += 2;

        showToast('❤️ Revive sudah dipakai hari ini');

        showToast('❤️ Nyawa pulih +1');

    // ============================================================
    // MODAL SYSTEM
    // ============================================================
    function showModal({ title, desc, confirmText, onConfirm, cancelText, onCancel, showProgress }) {
      if (!dom.modalOverlay) return;
      dom.modalTitle.textContent = title || 'Info';
      dom.modalDesc.textContent = desc || '';
      dom.modalConfirmBtn.textContent = confirmText || 'OK';
      dom.modalCancelBtn.textContent = cancelText || 'Tutup';
      dom.modalProgressWrap.style.display = showProgress ? 'block' : 'none';
      dom.modalProgressFill.style.width = '0%';
      dom.modalOverlay.classList.add('active');

      dom.modalConfirmBtn.onclick = () => {
        if (onConfirm) onConfirm();
        else closeModal();
      };
      dom.modalCancelBtn.onclick = () => {
        if (onCancel) onCancel();
        closeModal();
      };
    }

    function closeModal() {
      if (!dom.modalOverlay) return;
      dom.modalOverlay.classList.remove('active');
      if (state.adInterval) {
        clearInterval(state.adInterval);
        state.adInterval = null;
      }
      if (dom.modalProgressWrap) dom.modalProgressWrap.style.display = 'none';
    }

    // ============================================================
    // LIVE TICKER
    // ============================================================
    function startLiveTicker() {
      if (state.tickerInterval) clearInterval(state.tickerInterval);
      state.tickerInterval = setInterval(() => {
        const now = Date.now();
        if (now - state.lastPayoutTime < 30000) return;
        state.lastPayoutTime = now;
        const names = ['Sultan', 'CuanKing', 'Hoki', 'Maxwin', 'Duit'];
        const name = names[Math.floor(Math.random() * names.length)];
        const amount = Math.floor(Math.random() * 500000) + 50000;
        if (dom.liveTicker) {
          dom.liveTicker.textContent = `💸 ${name}*** baru saja WD ${formatNumber(amount)} koin!`;
          dom.liveTicker.style.opacity = '1';
          setTimeout(() => { if (dom.liveTicker) dom.liveTicker.style.opacity = '0.6'; }, 3000);
        }
      }, 5000);
    }

    // ============================================================
    // NAVIGATION
    // ============================================================
    function handleNav(tab) {
      state.currentTab = tab;
      document.querySelectorAll('.nav-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.nav === tab);
      });
      if (tab === 'spin') {
        showModal({
          title: '🎡 Spin Harian',
          desc: 'Putar roda untuk hadiah!',
          confirmText: 'Putar!',
          onConfirm: spinWheel,
          cancelText: 'Tutup',
        });
      } else if (tab === 'checkin') {
        showModal({
          title: '📅 Check-in 7 Hari',
          desc: `Streak: ${state.checkinStreak}/7\n` + 'Hadiah makin besar tiap hari!',
          confirmText: 'Check-in',
          onConfirm: claimCheckin,
          cancelText: 'Tutup',
        });
      } else if (tab === 'ranking') {
        const list = state.leaderboard.slice(0, 10).map((u, i) =>
          `${i + 1}. ${u.name} — ${formatNumber(u.coins)}`
        ).join('\n');
        showModal({
          title: '🏆 Leaderboard',
          desc: list || 'Belum ada data',
          confirmText: 'Tutup',
          cancelText: 'Tutup',
        });
      } else if (tab === 'wd') {
        submitWD();
      }
    }

    // ============================================================
    // [14] EVENT LISTENERS — SEMUA DI PALING BAWAH
    // ============================================================

    // Login
    if (dom.loginBtn) {
      dom.loginBtn.addEventListener('click', () => {
        handleLogin();
      });
    }

    // Toggle BGM
    if (dom.bgmToggle) {
      dom.bgmToggle.addEventListener('click', () => {
        initAudio();
        state.bgmEnabled = !state.bgmEnabled;
        updateToggleUI();
        if (state.bgmEnabled) startBGM(); else stopBGM();
        playSFX('click');
        saveGameData();
      });
    }

    // Toggle SFX
    if (dom.sfxToggle) {
      dom.sfxToggle.addEventListener('click', () => {
        initAudio();
        state.sfxEnabled = !state.sfxEnabled;
        updateToggleUI();
        playSFX('click');
        saveGameData();
      });
    }

    // Nav buttons
    $$('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const tab = btn.dataset.nav;
        if (tab) handleNav(tab);
      });
    });

    // Modal cancel
    if (dom.modalCancelBtn) {
      dom.modalCancelBtn.addEventListener('click', closeModal);
    }

    // Klik overlay untuk tutup
    if (dom.modalOverlay) {
      dom.modalOverlay.addEventListener('click', (e) => {
        if (e.target === dom.modalOverlay) closeModal();
      });
    }

    // ============================================================
    // PARTIKEL
    // ============================================================
    function createParticles() {
      if (!dom.particles) return;
      dom.particles.innerHTML = '';
      for (let i = 0; i < 30; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + '%';
        p.style.animationDuration = (Math.random() * 8 + 6) + 's';
        p.style.animationDelay = (Math.random() * 10) + 's';
        p.style.width = p.style.height = (Math.random() * 5 + 3) + 'px';
        dom.particles.appendChild(p);
      }
    }

    // ============================================================
    // [H] INIT — TIDAK BOLEH NGE-HANG
    // ============================================================
    async function init() {
      console.log('[Init] Mulai...');
      createParticles();
      updateToggleUI();
      loadGameData();
      updateUI();

      // Cek OAuth callback di URL
      if (handleOAuthCallback()) {
        console.log('[Init] Menunggu callback OAuth...');
        return;
      }

      // Cek session dengan timeout 2 detik
      const sessionCheck = (async () => {
        try {
          if (!supabase) return null;
          const { data: { session } } = await supabase.auth.getSession();
          return session;
        } catch (e) {
          console.warn('[Init] Session check gagal:', e.message);
          return null;
        }
      })();

      const timeout = new Promise(resolve => setTimeout(() => resolve('TIMEOUT'), 2000));
      const result = await Promise.race([sessionCheck, timeout]);

      if (result === 'TIMEOUT') {
        console.warn('[Init] Session check timeout → lanjut login screen');
      } else if (result && result.user) {
        console.log('[Init] Session aktif:', result.user.email);
        state.user = result.user;
        enterGame();
        history.replaceState(null, '', window.location.pathname);
        return;
      }

      console.log('[Init] Siap di login screen');
    }

    // Auth state change listener
    if (supabase) {
      safeRun(() => {
        supabase.auth.onAuthStateChange((event, session) => {
          console.log('[Auth] Event:', event);
          if (event === 'SIGNED_IN' && session?.user) {
            state.user = session.user;
            enterGame();
          } else if (event === 'SIGNED_OUT') {
            state.user = null;
            if (dom.gameScreen) dom.gameScreen.classList.add('hidden');
            if (dom.loginScreen) dom.loginScreen.classList.remove('hidden');
          } else if (event === 'TOKEN_REFRESHED' && session?.user) {
            state.user = session.user;
          }
        });
      }, 'onAuthStateChange');
    }

    // ============================================================
    // [16] EXPOSE DEBUG
    // ============================================================
    window.CuanBlok = {
      state,
      updateUI,
      showToast,
      demoLogin,
      enterGame,
    };

    // Panggil init
    init().catch(e => console.warn('[Init] Gagal:', e.message));

    // Prevent context menu on long press
    document.addEventListener('contextmenu', (e) => e.preventDefault());

    console.log('[CuanBlok] siap. Gunakan window.CuanBlok untuk debug.');
  </script>
</body>
</html>
