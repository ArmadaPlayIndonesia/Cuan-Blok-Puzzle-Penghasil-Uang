<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cuan Blok: Puzzle Penghasil Uang</title>
  <style>
    /* ================= GLOBAL & RESET ================= */
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      background: #0a0a0a; color: #fff; user-select: none;
    }
    /* ================= BACKGROUND ANIMASI ================= */
    #bg {
      position: fixed; inset: 0; z-index: 0;
      background: radial-gradient(circle at 20% 30%, #2A0808 0%, #1A0000 45%, #0a0a0a 100%);
      background-size: 200% 200%;
      animation: bgShift 12s ease-in-out infinite alternate;
    }
    @keyframes bgShift {
      0% { background-position: 0% 0%; }
      100% { background-position: 100% 100%; }
    }
    /* Partikel emas melayang */
    .particle {
      position: fixed; border-radius: 50%; pointer-events: none; z-index: 1;
      background: radial-gradient(circle, #ffd700, #ff8c00, transparent);
      opacity: 0.15; animation: floatUp linear infinite;
    }
    @keyframes floatUp {
      0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
      10% { opacity: 0.3; }
      90% { opacity: 0.3; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }
    /* ================= LAYOUT UTAMA ================= */
    #app { position: relative; z-index: 2; width: 100%; height: 100%; display: flex; flex-direction: column; }
    .screen {
      position: absolute; inset: 0; display: none; flex-direction: column;
      padding: 16px; overflow-y: auto; -webkit-overflow-scrolling: touch;
    }
    .screen.active { display: flex; }
    /* ================= KOMPONEN UMUM ================= */
    .btn {
      border: none; border-radius: 16px; padding: 14px 24px; font-size: 16px; font-weight: 700;
      cursor: pointer; transition: transform 0.15s, box-shadow 0.2s, filter 0.2s;
      color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.5); position: relative; overflow: hidden;
    }
    .btn:active { transform: scale(0.94); }
    .btn-gold {
      background: linear-gradient(145deg, #ffd700, #b8860b);
      box-shadow: 0 0 18px rgba(255,215,0,0.6), 0 6px 14px rgba(0,0,0,0.5);
    }
    .btn-red {
      background: linear-gradient(145deg, #ff2a2a, #8b0000);
      box-shadow: 0 0 18px rgba(255,42,42,0.6), 0 6px 14px rgba(0,0,0,0.5);
    }
    .btn-dark {
      background: linear-gradient(145deg, #333, #111);
      box-shadow: 0 0 10px rgba(255,255,255,0.15), 0 4px 10px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,215,0,0.3);
    }
    .btn:disabled { filter: grayscale(0.8) brightness(0.5); cursor: not-allowed; transform: none; }
    .glass {
      background: rgba(20, 5, 5, 0.7);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 215, 0, 0.25);
      border-radius: 22px;
      box-shadow: 0 0 30px rgba(255, 0, 0, 0.25), inset 0 0 20px rgba(255,215,0,0.05);
    }
    .title {
      font-size: clamp(24px, 7vw, 40px); font-weight: 900; text-align: center;
      background: linear-gradient(180deg, #fff8dc, #ffd700, #b8860b);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      text-shadow: 0 0 24px rgba(255,215,0,0.5);
      letter-spacing: 1px;
    }
    .tagline {
      text-align: center; font-size: 13px; color: #ffcc80; margin-top: 6px; font-style: italic;
      text-shadow: 0 0 8px rgba(255,100,0,0.5);
    }
    /* ================= HALAMAN LOGIN ================= */
    #loginScreen { justify-content: center; align-items: center; gap: 24px; text-align: center; }
    #loginScreen .logo-box {
      padding: 30px 24px; width: 100%; max-width: 400px;
    }
    .logo-emoji { font-size: 60px; display: block; margin-bottom: 8px; animation: bounce 2s infinite; }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
    .google-btn {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      background: #fff; color: #222; font-weight: 700; border-radius: 14px;
      padding: 14px 20px; width: 100%; max-width: 320px; margin: 0 auto;
      box-shadow: 0 0 20px rgba(255,255,255,0.3); border: none; cursor: pointer;
      font-size: 15px; transition: transform 0.15s;
    }
    .google-btn:active { transform: scale(0.95); }
    .google-btn img { width: 22px; height: 22px; }
    .privacy-link {
      color: #ffcc80; text-decoration: underline; font-size: 13px; cursor: pointer;
      margin-top: 10px; display: inline-block;
    }
    /* ================= HEADER GAME ================= */
    #gameHeader {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 14px; margin-bottom: 8px; flex-wrap: wrap; gap: 8px;
    }
    .hud-item { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; }
    .hud-value {
      background: rgba(0,0,0,0.5); padding: 4px 10px; border-radius: 10px;
      border: 1px solid rgba(255,215,0,0.4); color: #ffd700; font-size: 14px;
      min-width: 50px; text-align: center;
    }
    #livesDisplay { font-size: 22px; letter-spacing: 2px; filter: drop-shadow(0 0 6px #ff2a2a); }
    /* ================= GRID PUZZLE ================= */
    #gridContainer {
      flex: 1; display: flex; align-items: center; justify-content: center; padding: 6px;
    }
    #grid {
      display: grid; gap: 5px; width: 100%; max-width: 420px;
      aspect-ratio: 1 / 1; touch-action: manipulation;
    }
    .block {
      border-radius: 10px; cursor: pointer; transition: transform 0.1s, box-shadow 0.15s, opacity 0.2s;
      box-shadow: inset 0 -4px 0 rgba(0,0,0,0.3), 0 3px 6px rgba(0,0,0,0.5);
      position: relative; animation: popIn 0.3s ease-out;
    }
    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .block:active { transform: scale(0.9); }
    .block.selected {
      box-shadow: 0 0 18px 6px #fff, inset 0 0 12px rgba(255,255,255,0.8);
      transform: scale(1.06); z-index: 3;
    }
    .block.hint {
      animation: hintPulse 0.6s infinite alternate;
    }
    @keyframes hintPulse {
      0% { box-shadow: 0 0 8px 2px #fff; }
      100% { box-shadow: 0 0 24px 8px #ffd700; }
    }
    .block.clearing {
      animation: clearAnim 0.35s forwards;
    }
    @keyframes clearAnim {
      0% { transform: scale(1); opacity: 1; }
      60% { transform: scale(1.3) rotate(10deg); opacity: 0.8; }
      100% { transform: scale(0); opacity: 0; }
    }
    /* ================= PANEL BAWAH / POWER-UP ================= */
    #bottomPanel {
      display: flex; justify-content: center; gap: 10px; padding: 10px 0 14px; flex-wrap: wrap;
    }
    .power-btn {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px; padding: 10px 16px; border-radius: 16px; font-size: 12px; font-weight: 700;
      min-width: 80px; border: 1px solid rgba(255,215,0,0.3);
      background: linear-gradient(145deg, rgba(60,20,20,0.9), rgba(20,5,5,0.9));
      color: #ffd700; cursor: pointer; transition: transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 0 12px rgba(255,0,0,0.2);
    }
    .power-btn:active { transform: scale(0.92); }
    .power-btn .ico { font-size: 22px; }
    .power-btn:disabled { filter: grayscale(1); opacity: 0.5; }
    /* ================= OVERLAY / MODAL ================= */
    .overlay {
      position: fixed; inset: 0; z-index: 100; display: none;
      align-items: center; justify-content: center; padding: 20px;
      background: rgba(0,0,0,0.85); backdrop-filter: blur(6px);
    }
    .overlay.active { display: flex; animation: fadeIn 0.25s; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .modal {
      width: 100%; max-width: 380px; padding: 24px 20px; text-align: center;
      animation: modalPop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes modalPop {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .modal h2 { font-size: 22px; margin-bottom: 10px; color: #ffd700; }
    .modal p { font-size: 14px; color: #ffcc80; margin-bottom: 16px; line-height: 1.5; }
    /* ================= LEADERBOARD ================= */
    #leaderboardList { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
    .lb-row {
      display: flex; align-items: center; gap: 10px; padding: 10px 14px;
      border-radius: 14px; background: rgba(0,0,0,0.5);
      border: 1px solid rgba(255,215,0,0.2); font-size: 14px;
    }
    .lb-row.top1 { border-color: #ffd700; box-shadow: 0 0 16px rgba(255,215,0,0.4); }
    .lb-row.top2 { border-color: #c0c0c0; }
    .lb-row.top3 { border-color: #cd7f32; }
    .lb-rank { font-size: 20px; width: 34px; text-align: center; font-weight: 900; }
    .lb-name { flex: 1; font-weight: 700; }
    .lb-score { color: #ffd700; font-weight: 700; }
    /* ================= FULLSCREEN OFFLINE ================= */
    #offlineOverlay {
      position: fixed; inset: 0; z-index: 500; display: none;
      flex-direction: column; align-items: center; justify-content: center;
      background: rgba(10,0,0,0.97); text-align: center; padding: 30px;
    }
    #offlineOverlay.active { display: flex; }
    /* ================= COIN FLOAT ================= */
    .coin-float {
      position: fixed; z-index: 200; font-size: 20px; font-weight: 900; color: #ffd700;
      text-shadow: 0 0 10px #ff8c00; pointer-events: none;
      animation: coinUp 1s ease-out forwards;
    }
    @keyframes coinUp {
      0% { transform: translateY(0) scale(0.8); opacity: 1; }
      100% { transform: translateY(-80px) scale(1.4); opacity: 0; }
    }
    /* ================= RESPONSIVE ================= */
    @media (max-width: 400px) {
      .btn { padding: 12px 18px; font-size: 14px; }
      .hud-item { font-size: 12px; }
    }
    /* Scrollbar tipis */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-thumb { background: #ffd70055; border-radius: 10px; }
  </style>
</head>
<body>
  <div id="bg"></div>

  <!-- ================= LOGIN SCREEN ================= -->
  <div id="loginScreen" class="screen active">
    <div class="logo-box glass">
      <span class="logo-emoji">💰</span>
      <h1 class="title">Cuan Blok</h1>
      <p class="tagline">"Game Asah Otak Paling Cuan: Main Santai, Saldo Cair Setiap Hari!"</p>
      <div style="margin-top: 26px;"></div>
      <button class="google-btn" id="googleSignInBtn">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" />
        Masuk dengan Google
      </button>
      <div style="margin-top: 14px;">
        <span class="privacy-link" id="privacyLinkLogin">Kebijakan Privasi</span>
      </div>
    </div>
  </div>

  <!-- ================= MAIN GAME SCREEN ================= -->
  <div id="gameScreen" class="screen">
    <div id="gameHeader" class="glass">
      <div class="hud-item">❤️ <span id="livesDisplay">❤️❤️❤️</span></div>
      <div class="hud-item">🪙 <span class="hud-value" id="coinDisplay">0</span></div>
      <div class="hud-item">📊 Lv <span class="hud-value" id="levelDisplay">1</span></div>
      <div class="hud-item">🎯 <span class="hud-value" id="scoreDisplay">0</span></div>
    </div>

    <div id="gridContainer">
      <div id="grid"></div>
    </div>

    <div id="bottomPanel">
      <button class="power-btn" id="shuffleBtn"><span class="ico">🔀</span>Acak</button>
      <button class="power-btn" id="hintBtn"><span class="ico">💡</span>Petunjuk</button>
      <button class="power-btn" id="leaderboardBtn"><span class="ico">🏆</span>Turnamen</button>
      <button class="power-btn" id="withdrawBtn"><span class="ico">💸</span>WD</button>
      <button class="power-btn" id="privacyBtn"><span class="ico">🔒</span>Privasi</button>
    </div>
  </div>

  <!-- ================= OVERLAYS ================= -->
  <div class="overlay" id="genericOverlay">
    <div class="modal glass" id="genericModal">
      <h2 id="modalTitle">Judul</h2>
      <p id="modalText">Deskripsi</p>
      <button class="btn btn-gold" id="modalConfirmBtn" style="width:100%;">Lanjut</button>
      <button class="btn btn-dark" id="modalCancelBtn" style="width:100%; margin-top:8px; display:none;">Batal</button>
    </div>
  </div>

  <!-- Leaderboard Overlay -->
  <div class="overlay" id="leaderboardOverlay">
    <div class="modal glass" style="max-width:420px; text-align:left;">
      <h2 style="text-align:center;">🏆 Turnamen Mingguan</h2>
      <p style="text-align:center; font-size:12px;">Peringkat diperbarui otomatis. Hadiah koin besar menanti!</p>
      <div id="leaderboardList"></div>
      <button class="btn btn-red" id="closeLeaderboard" style="width:100%; margin-top:16px;">Tutup</button>
    </div>
  </div>

  <!-- Offline Overlay -->
  <div id="offlineOverlay">
    <span style="font-size:60px;">📡</span>
    <h2 style="color:#ff2a2a; font-size:24px; margin:14px 0;">Koneksi Terputus</h2>
    <p style="color:#ffcc80; max-width:300px;">Game dijeda. Sambungkan internet untuk melanjutkan.</p>
    <button class="btn btn-gold" style="margin-top:22px;" onclick="location.reload()">Muat Ulang</button>
  </div>

  <script>
    /* =========================================================================
       CUAN BLOK - SINGLE FILE GAME
       Catatan: Supabase Auth, AdMob SDK, dan Withdrawal nyata memerlukan
       konfigurasi backend & SDK. Di sini disimulasikan dengan state machine
       agar logika anti-skip & anti-force-close dapat diuji.
       ========================================================================= */

    // ---------- KONFIGURASI ----------
    const AD_IDS = {
      rewarded: 'ca-app-pub-4310670917209711/3901057804',
      interstitial: 'ca-app-pub-4310670917209711/8013719329',
      rewardedInterstitial: 'ca-app-pub-4310670917209711/4266046006',
      fallbackUrl: 'https://omg10.com/4/11785165'
    };

    // ---------- STATE GLOBAL ----------
    const State = {
      user: null,
      coins: 0,
      level: 1,
      score: 0,
      lives: 3,
      grid: [],
      gridSize: 8,
      colors: ['#e53935','#1e88e5','#43a047','#fdd835','#8e24aa','#fb8c00'],
      selected: [],
      isProcessing: false,
      // Anti-skip state machine
      pendingAd: null,        // 'level_complete' | 'revive' | 'convert'
      adInProgress: false,
      // For anti-force-close: simpan status di localStorage
      persistentState: null,
    };

    // ---------- UTILITAS ----------
    const $ = (sel) => document.querySelector(sel);
    const $$ = (sel) => document.querySelectorAll(sel);

    function savePersistentState() {
      const data = {
        level: State.level,
        coins: State.coins,
        score: State.score,
        lives: State.lives,
        pendingAd: State.pendingAd,
        userId: State.user?.id || null,
        timestamp: Date.now()
      };
      localStorage.setItem('cuanblok_state', JSON.stringify(data));
    }

    function loadPersistentState() {
      try {
        const raw = localStorage.getItem('cuanblok_state');
        return raw ? JSON.parse(raw) : null;
      } catch { return null; }
    }

    function clearPersistentState() {
      localStorage.removeItem('cuanblok_state');
    }

    // ---------- PARTIKEL BACKGROUND ----------
    function spawnParticles() {
      const count = 22;
      for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        const size = Math.random() * 6 + 3;
        p.style.width = size + 'px';
        p.style.height = size + 'px';
        p.style.left = Math.random() * 100 + 'vw';
        p.style.animationDuration = (Math.random() * 12 + 10) + 's';
        p.style.animationDelay = (Math.random() * 10) + 's';
        document.body.appendChild(p);
      }
    }

    // ---------- SIMULASI SUPABASE AUTH ----------
    async function simulateGoogleSignIn() {
      // Simulasi delay jaringan
      return new Promise((resolve) => {
        setTimeout(() => {
          State.user = { id: 'user_' + Date.now(), email: 'player@gmail.com', name: 'Pemain Cuan' };
          resolve(State.user);
        }, 800);
      });
    }

    // ---------- SIMULASI ADMOB SDK (MULTI-AD WATERFALL) ----------
    async function showRewardedAd() {
      // Simulasi callback sukses dari SDK iklan
      return new Promise((resolve) => {
        // Simulasi pemuatan iklan
        setTimeout(() => {
          // 85% sukses AdMob, 15% fallback ke link cadangan
          const success = Math.random() < 0.85;
          if (success) {
            console.log('[AdMob Rewarded] Iklan selesai ditonton:', AD_IDS.rewarded);
            resolve({ success: true, source: 'admob' });
          } else {
            console.log('[Fallback] Membuka link cadangan:', AD_IDS.fallbackUrl);
            // Di production: window.open(AD_IDS.fallbackUrl, '_blank')
            resolve({ success: true, source: 'fallback' });
          }
        }, 1200);
      });
    }

    async function showInterstitialChain(count = 3) {
      // Simulasi 3 video iklan beruntun
      for (let i = 0; i < count; i++) {
        await new Promise((r) => setTimeout(r, 700));
        console.log(`[AdMob Interstitial] Iklan ${i+1}/${count} selesai:`, AD_IDS.interstitial);
      }
      return { success: true, count };
    }

    // ---------- ENGINE PUZZLE ----------
    function generateGrid(size) {
      const grid = [];
      for (let r = 0; r < size; r++) {
        const row = [];
        for (let c = 0; c < size; c++) {
          row.push(Math.floor(Math.random() * State.colors.length));
        }
        grid.push(row);
      }
      return grid;
    }

    function renderGrid() {
      const gridEl = $('#grid');
      const size = State.gridSize;
      gridEl.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
      gridEl.innerHTML = '';
      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          const colorIdx = State.grid[r][c];
          const block = document.createElement('div');
          block.className = 'block';
          block.dataset.r = r;
          block.dataset.c = c;
          if (colorIdx === -1) {
            block.style.background = 'transparent';
            block.style.boxShadow = 'none';
            block.style.pointerEvents = 'none';
            block.style.opacity = '0';
          } else {
            const base = State.colors[colorIdx];
            block.style.background = `linear-gradient(145deg, ${base}, ${shadeColor(base, -30)})`;
            block.style.boxShadow = `inset 0 -4px 0 rgba(0,0,0,0.3), 0 3px 6px rgba(0,0,0,0.5), 0 0 8px ${base}55`;
          }
          block.addEventListener('click', () => onBlockClick(r, c));
          gridEl.appendChild(block);
        }
      }
    }

    function shadeColor(hex, percent) {
      const num = parseInt(hex.replace('#',''), 16);
      const amt = Math.round(2.55 * percent);
      const R = Math.min(255, Math.max(0, (num >> 16) + amt));
      const G = Math.min(255, Math.max(0, ((num >> 8) & 0x00FF) + amt));
      const B = Math.min(255, Math.max(0, (num & 0x0000FF) + amt));
      return '#' + (0x1000000 + R*0x10000 + G*0x100 + B).toString(16).slice(1);
    }

    function getConnectedBlocks(r, c, colorIdx, visited = new Set()) {
      const key = `${r},${c}`;
      if (visited.has(key)) return [];
      if (r < 0 || c < 0 || r >= State.gridSize || c >= State.gridSize) return [];
      if (State.grid[r][c] !== colorIdx) return [];
      visited.add(key);
      let result = [{ r, c }];
      result = result.concat(getConnectedBlocks(r+1, c, colorIdx, visited));
      result = result.concat(getConnectedBlocks(r-1, c, colorIdx, visited));
      result = result.concat(getConnectedBlocks(r, c+1, colorIdx, visited));
      result = result.concat(getConnectedBlocks(r, c-1, colorIdx, visited));
      return result;
    }

    async function onBlockClick(r, c) {
      if (State.isProcessing || State.lives <= 0) return;
      const colorIdx = State.grid[r][c];
      if (colorIdx === -1) return;

      const group = getConnectedBlocks(r, c, colorIdx);
      if (group.length < 3) {
        // Salah klik: kurangi nyawa
        State.lives = Math.max(0, State.lives - 1);
        updateHUD();
        savePersistentState();
        showToast('❌ Minimal 3 blok! Nyawa -1');
        if (State.lives <= 0) {
          await handleLivesDepleted();
        }
        return;
      }

      // Blok valid: hancurkan
      State.isProcessing = true;
      group.forEach(({ r, c }) => {
        const block = document.querySelector(`.block[data-r="${r}"][data-c="${c}"]`);
        if (block) block.classList.add('clearing');
      });

      // Hitung skor & koin
      const gainedScore = group.length * 10;
      const gainedCoins = group.length * 2;
      State.score += gainedScore;
      State.coins += gainedCoins;
      showCoinFloat(`+${gainedCoins} 🪙`);
      updateHUD();

      // Hapus dari grid setelah animasi
      setTimeout(() => {
        group.forEach(({ r, c }) => { State.grid[r][c] = -1; });
        applyGravityAndRefill();
        renderGrid();
        State.isProcessing = false;

        // Cek level selesai (tidak ada blok tersisa)
        if (isGridEmpty()) {
          onLevelComplete();
        }
      }, 350);
    }

    function applyGravityAndRefill() {
      const size = State.gridSize;
      for (let c = 0; c < size; c++) {
        const column = [];
        for (let r = size - 1; r >= 0; r--) {
          if (State.grid[r][c] !== -1) column.push(State.grid[r][c]);
        }
        for (let r = size - 1; r >= 0; r--) {
          if (column.length > 0) {
            State.grid[r][c] = column.shift();
          } else {
            State.grid[r][c] = Math.floor(Math.random() * State.colors.length);
          }
        }
      }
    }

    function isGridEmpty() {
      for (let r = 0; r < State.gridSize; r++)
        for (let c = 0; c < State.gridSize; c++)
          if (State.grid[r][c] !== -1) return false;
      return true;
    }

    // ---------- LEVEL & ANTI-SKIP AD ----------
    async function onLevelComplete() {
      // Set state waiting_for_ad di database (simulasi)
      State.pendingAd = 'level_complete';
      savePersistentState();
      console.log('[Supabase] Status diubah menjadi: waiting_for_ad');

      showModal(
        '🎉 Level Selesai!',
        'Tonton 3 video iklan beruntun untuk lanjut ke level berikutnya.',
        'Tonton Iklan',
        async () => {
          hideModal();
          await showInterstitialChain(3);
          // Callback sukses -> buka level berikutnya
          State.pendingAd = null;
          State.level += 1;
          State.gridSize = Math.min(10, 7 + Math.floor(State.level / 2));
          State.grid = generateGrid(State.gridSize);
          State.score = 0;
          renderGrid();
          updateHUD();
          clearPersistentState();
          showToast('✅ Level ' + State.level + ' dimulai!');
        },
        false // tidak bisa dibatalkan
      );
    }

    async function handleLivesDepleted() {
      showModal(
        '💔 Nyawa Habis',
        'Tonton iklan berhadiah untuk mengisi ulang 3 nyawa.',
        'Tonton Iklan',
        async () => {
          hideModal();
          const result = await showRewardedAd();
          if (result.success) {
            State.lives = 3;
            updateHUD();
            savePersistentState();
            showToast('❤️❤️❤️ Nyawa terisi penuh!');
          }
        },
        false
      );
    }

    // ---------- POWER-UPS (REWARDED) ----------
    async function useShuffle() {
      if (State.isProcessing) return;
      showModal(
        '🔀 Acak Grid',
        'Tonton iklan berhadiah untuk mengacak susunan blok.',
        'Tonton Iklan',
        async () => {
          hideModal();
          const result = await showRewardedAd();
          if (result.success) {
            State.grid = generateGrid(State.gridSize);
            renderGrid();
            showToast('🔀 Grid diacak!');
          }
        }
      );
    }

    async function useHint() {
      if (State.isProcessing) return;
      showModal(
        '💡 Petunjuk',
        'Tonton iklan berhadiah untuk melihat petunjuk blok yang bisa dihancurkan.',
        'Tonton Iklan',
        async () => {
          hideModal();
          const result = await showRewardedAd();
          if (result.success) {
            highlightHint();
          }
        }
      );
    }

    function highlightHint() {
      // Cari grup >= 3 pertama
      for (let r = 0; r < State.gridSize; r++) {
        for (let c = 0; c < State.gridSize; c++) {
          const colorIdx = State.grid[r][c];
          if (colorIdx === -1) continue;
          const group = getConnectedBlocks(r, c, colorIdx);
          if (group.length >= 3) {
            group.forEach(({ r, c }) => {
              const block = document.querySelector(`.block[data-r="${r}"][data-c="${c}"]`);
              if (block) block.classList.add('hint');
            });
            setTimeout(() => {
              document.querySelectorAll('.block.hint').forEach(b => b.classList.remove('hint'));
            }, 2500);
            showToast('💡 Petunjuk ditampilkan!');
            return;
          }
        }
      }
      showToast('Tidak ada grup yang bisa dihancurkan. Gunakan Acak.');
    }

    // ---------- WITHDRAWAL & KONVERSI ----------
    async function handleWithdraw() {
      // Konversi koin ke dollar (simulasi: 1000 koin = $1)
      const dollarValue = State.coins / 1000;
      if (dollarValue < 1.00) {
        showModal(
          '💸 Saldo Belum Cukup',
          `Minimal WD $1.00. Saldo Anda saat ini: $${dollarValue.toFixed(2)}. Kumpulkan lebih banyak koin!`,
          'OK',
          () => hideModal(),
          false
        );
        return;
      }

      showModal(
        '💸 Konversi & WD',
        `Saldo: $${dollarValue.toFixed(2)}. Tonton iklan wajib untuk melanjutkan konversi.`,
        'Tonton Iklan',
        async () => {
          hideModal();
          const result = await showRewardedAd();
          if (result.success) {
            // Simulasi pencatatan ke tabel withdrawals Supabase
            console.log('[Supabase] Withdrawal dicatat:', {
              user_id: State.user?.id,
              amount: dollarValue,
              method: 'DANA/OVO/GoPay',
              status: 'pending'
            });
            showModal(
              '✅ WD Diajukan',
              `Penarikan $${dollarValue.toFixed(2)} sedang diproses. Cek saldo DANA/OVO/GoPay Anda.`,
              'OK',
              () => {
                hideModal();
                State.coins = 0;
                updateHUD();
                savePersistentState();
              },
              false
            );
          }
        }
      );
    }

    // ---------- LEADERBOARD (BOT SULTAN) ----------
    function generateLeaderboard() {
      const bots = [
        { name: 'Sultan Cuan', score: 999999, level: 99 },
        { name: 'Raja Blok', score: 888888, level: 95 },
        { name: 'Master Koin', score: 777777, level: 90 },
        { name: 'Haji Cuan', score: 666666, level: 85 },
        { name: 'Bos Besar', score: 555555, level: 80 },
      ];
      const playerScore = State.score + (State.level * 100);
      const list = [...bots];
      list.push({ name: 'Anda', score: playerScore, level: State.level, isPlayer: true });
      list.sort((a, b) => b.score - a.score);
      return list;
    }

    function renderLeaderboard() {
      const list = generateLeaderboard();
      const container = $('#leaderboardList');
      container.innerHTML = '';
      list.forEach((item, idx) => {
        const row = document.createElement('div');
        row.className = 'lb-row';
        if (idx === 0) row.classList.add('top1');
        else if (idx === 1) row.classList.add('top2');
        else if (idx === 2) row.classList.add('top3');
        if (item.isPlayer) row.style.borderColor = '#ff2a2a';
        row.innerHTML = `
          <span class="lb-rank">${idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : '#' + (idx+1)}</span>
          <span class="lb-name">${item.name}</span>
          <span class="lb-score">${item.score.toLocaleString()}</span>
        `;
        container.appendChild(row);
      });
    }

    // ---------- UI HELPERS ----------
    function updateHUD() {
      $('#coinDisplay').textContent = State.coins.toLocaleString();
      $('#levelDisplay').textContent = State.level;
      $('#scoreDisplay').textContent = State.score.toLocaleString();
      $('#livesDisplay').textContent = '❤️'.repeat(State.lives) + '🖤'.repeat(3 - State.lives);
    }

    function showToast(msg) {
      const t = document.createElement('div');
      t.textContent = msg;
      t.style.cssText = `
        position:fixed; bottom:90px; left:50%; transform:translateX(-50%);
        background:rgba(0,0,0,0.85); color:#ffd700; padding:10px 20px;
        border-radius:14px; font-weight:700; font-size:14px; z-index:300;
        border:1px solid rgba(255,215,0,0.4); box-shadow:0 0 20px rgba(255,0,0,0.3);
        animation: fadeIn 0.2s;
      `;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 2200);
    }

    function showCoinFloat(text) {
      const el = document.createElement('div');
      el.className = 'coin-float';
      el.textContent = text;
      el.style.left = (window.innerWidth / 2 - 30) + 'px';
      el.style.top = (window.innerHeight / 2 - 40) + 'px';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1000);
    }

    // Modal generik
    let modalCallback = null;
    function showModal(title, text, confirmLabel, callback, cancellable = true) {
      $('#modalTitle').textContent = title;
      $('#modalText').textContent = text;
      $('#modalConfirmBtn').textContent = confirmLabel;
      $('#modalCancelBtn').style.display = cancellable ? 'block' : 'none';
      modalCallback = callback;
      $('#genericOverlay').classList.add('active');
    }
    function hideModal() {
      $('#genericOverlay').classList.remove('active');
      modalCallback = null;
    }
    $('#modalConfirmBtn').addEventListener('click', () => {
      if (modalCallback) modalCallback();
    });
    $('#modalCancelBtn').addEventListener('click', hideModal);

    // ---------- KONEKSI REAL-TIME ----------
    function setupConnectivity() {
      const overlay = $('#offlineOverlay');
      const update = () => {
        if (!navigator.onLine) {
          overlay.classList.add('active');
          State.isProcessing = true; // pause game
        } else {
          overlay.classList.remove('active');
          State.isProcessing = false;
        }
      };
      window.addEventListener('online', update);
      window.addEventListener('offline', update);
      update();
    }

    // ---------- INIT & START ----------
    async function initGame() {
      // Cek state persisten (anti-force-close)
      const saved = loadPersistentState();
      if (saved && saved.pendingAd === 'level_complete') {
        // Paksa tonton iklan sebelum lanjut
        State.level = saved.level;
        State.coins = saved.coins;
        State.score = saved.score;
        State.lives = saved.lives;
        State.pendingAd = 'level_complete';
        showModal(
          '⏳ Iklan Tertunda',
          'Anda memiliki iklan yang belum ditonton. Tonton sekarang untuk melanjutkan.',
          'Tonton Iklan',
          async () => {
            hideModal();
            await showInterstitialChain(3);
            State.pendingAd = null;
            State.level += 1;
            startGame();
          },
          false
        );
      } else {
        startGame();
      }
    }

    function startGame() {
      if (!State.grid || State.grid.length === 0) {
        State.grid = generateGrid(State.gridSize);
      }
      renderGrid();
      updateHUD();
      savePersistentState();
    }

    // ---------- EVENT BINDING ----------
    function bindEvents() {
      // Login
      $('#googleSignInBtn').addEventListener('click', async () => {
        const user = await simulateGoogleSignIn();
        console.log('[Supabase Auth] Login sukses:', user.email);
        $('#loginScreen').classList.remove('active');
        $('#gameScreen').classList.add('active');
        initGame();
      });

      // Privacy
      $('#privacyLinkLogin').addEventListener('click', () => {
        showModal(
          '🔒 Kebijakan Privasi',
          'Kami menggunakan Google Sign-In untuk autentikasi, menyimpan progress game di Supabase, dan menampilkan iklan AdMob. Data Anda aman dan tidak dibagikan ke pihak ketiga tanpa izin.',
          'Mengerti',
          () => hideModal(),
          false
        );
      });
      $('#privacyBtn').addEventListener('click', () => {
        showModal(
          '🔒 Kebijakan Privasi',
          'Kami menggunakan Google Sign-In untuk autentikasi, menyimpan progress game di Supabase, dan menampilkan iklan AdMob. Data Anda aman dan tidak dibagikan ke pihak ketiga tanpa izin.',
          'Mengerti',
          () => hideModal(),
          false
        );
      });

      // Power-ups
      $('#shuffleBtn').addEventListener('click', useShuffle);
      $('#hintBtn').addEventListener('click', useHint);

      // Leaderboard
      $('#leaderboardBtn').addEventListener('click', () => {
        renderLeaderboard();
        $('#leaderboardOverlay').classList.add('active');
      });
      $('#closeLeaderboard').addEventListener('click', () => {
        $('#leaderboardOverlay').classList.remove('active');
      });

      // Withdraw
      $('#withdrawBtn').addEventListener('click', handleWithdraw);
    }

    // ---------- BOOTSTRAP ----------
    spawnParticles();
    setupConnectivity();
    bindEvents();

    // Cek sesi login tersimpan (simulasi)
    const savedState = loadPersistentState();
    if (savedState && savedState.userId) {
      // Auto-login simulasi
      State.user = { id: savedState.userId, email: 'player@gmail.com', name: 'Pemain Cuan' };
      $('#loginScreen').classList.remove('active');
      $('#gameScreen').classList.add('active');
      State.level = savedState.level || 1;
      State.coins = savedState.coins || 0;
      State.score = savedState.score || 0;
      State.lives = savedState.lives || 3;
      State.gridSize = Math.min(10, 7 + Math.floor(State.level / 2));
      initGame();
    }
  </script>
</body>
</html>
