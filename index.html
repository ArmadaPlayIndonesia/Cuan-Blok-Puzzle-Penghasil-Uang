<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>CUAN BLOK: PUZZLE PENGHASIL UANG</title>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
  background: linear-gradient(160deg, #2A0808 0%, #1A0000 40%, #0a0a0a 100%);
  color: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100dvh;
  position: relative;
  overflow: hidden;
}
#particles { position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
.particle {
  position: absolute; width: 6px; height: 6px; border-radius: 50%;
  background: radial-gradient(circle, #ffd700, #b8860b);
  box-shadow: 0 0 8px #ffd700aa;
  animation: floatUp linear infinite;
  opacity: 0;
}
@keyframes floatUp {
  0% { transform: translateY(100vh) scale(0); opacity: 0; }
  10% { opacity: 0.9; }
  90% { opacity: 0.6; }
  100% { transform: translateY(-10vh) scale(1); opacity: 0; }
}
.arcade {
  width: 100%; max-width: 480px; height: 100dvh;
  display: flex; flex-direction: column;
  position: relative; z-index: 2;
  background: rgba(20, 5, 5, 0.55);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-left: 1px solid rgba(255, 215, 0, 0.18);
  border-right: 1px solid rgba(255, 215, 0, 0.18);
  overflow: hidden;
}
.screen { display: none; flex-direction: column; height: 100%; width: 100%; }
.screen.active { display: flex; }

/* ===== LOGIN ===== */
#screen-login { justify-content: center; align-items: center; padding: 24px; text-align: center; }
.login-logo { width: 110px; height: 110px; margin-bottom: 18px; animation: spinCoin 3.5s linear infinite; }
@keyframes spinCoin { 0% { transform: rotateY(0deg); } 100% { transform: rotateY(360deg); } }
.login-title {
  font-size: 42px; font-weight: 900; letter-spacing: 3px;
  background: linear-gradient(180deg, #fff7cc, #ffd700 40%, #b8860b);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
  margin-bottom: 8px; text-shadow: 0 0 30px rgba(255,215,0,0.3);
}
.login-sub { font-size: 12px; letter-spacing: 6px; color: #ffd700; opacity: 0.85; margin-bottom: 38px; font-weight: 600; }
.btn-primary {
  display: inline-flex; align-items: center; gap: 12px;
  background: #fff; color: #1a0000; border: none;
  padding: 16px 42px; border-radius: 50px;
  font-size: 19px; font-weight: 800; cursor: pointer;
  box-shadow: 0 8px 32px rgba(255,255,255,0.25), 0 0 0 2px #ffd70055;
  animation: bounceBtn 1.8s ease-in-out infinite;
  transition: transform 0.15s;
}
.btn-primary:active { transform: scale(0.95); }
@keyframes bounceBtn {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-7px); }
}
.btn-primary svg { width: 28px; height: 28px; }
.login-hint { margin-top: 30px; font-size: 12px; color: #aaa; letter-spacing: 0.5px; }

/* ===== GAME HEADER ===== */
.game-header {
  padding: 12px 14px 8px; display: flex; flex-direction: column; gap: 8px;
  border-bottom: 1px solid rgba(255,215,0,0.12); flex-shrink: 0;
}
.header-top { display: flex; justify-content: space-between; align-items: center; }
.coin-display { display: flex; align-items: center; gap: 7px; font-size: 19px; font-weight: 800; color: #ffd700; }
.coin-display svg { width: 26px; height: 26px; filter: drop-shadow(0 0 8px #ffd700aa); }
.header-stats { display: flex; gap: 10px; align-items: center; font-size: 13px; }
.stat-pill {
  background: rgba(255,255,255,0.07); padding: 4px 10px; border-radius: 20px;
  border: 1px solid rgba(255,215,0,0.15); display: flex; align-items: center; gap: 4px;
  font-weight: 600;
}
.header-btns { display: flex; gap: 6px; }
.icon-btn {
  background: rgba(255,255,255,0.08); border: 1px solid rgba(255,215,0,0.18);
  color: #fff; border-radius: 10px; padding: 6px 9px; font-size: 12px;
  cursor: pointer; font-weight: 600; transition: background 0.2s;
}
.icon-btn:active { background: rgba(255,215,0,0.2); }
.vip-badge { font-size: 11px; color: #ffd700; font-weight: 800; }
.heart-row { display: flex; gap: 3px; font-size: 15px; }

/* ===== TICKER ===== */
.ticker {
  height: 0; overflow: hidden; transition: height 0.4s;
  background: rgba(255,215,0,0.08); border-bottom: 1px solid rgba(255,215,0,0.15);
  display: flex; align-items: center; padding: 0 14px; font-size: 12px;
  color: #ffe066; white-space: nowrap; flex-shrink: 0;
}
.ticker.show { height: 30px; }
.ticker span { filter: drop-shadow(0 0 6px #ffd700); margin-right: 6px; }

/* ===== BOARD ===== */
.game-body { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 10px; overflow: hidden; }
.board-wrap { position: relative; width: 100%; max-width: 400px; }
#board {
  display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px;
  background: rgba(0,0,0,0.35); padding: 6px; border-radius: 16px;
  border: 1px solid rgba(255,215,0,0.15);
}
.cell {
  aspect-ratio: 1; border-radius: 7px; cursor: pointer;
  transition: transform 0.12s, box-shadow 0.12s, opacity 0.25s;
  position: relative; display: flex; align-items: center; justify-content: center;
  font-size: 20px; user-select: none;
}
.cell:active { transform: scale(0.88); }
.cell.pop { animation: popClear 0.3s ease-out forwards; }
@keyframes popClear {
  0% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.35); opacity: 0.8; }
  100% { transform: scale(0); opacity: 0; }
}
.cell.hammer-target { outline: 2px dashed #ffd700; outline-offset: -2px; }
.cell .chest-icon { font-size: 22px; filter: drop-shadow(0 0 5px #ffd700); animation: chestPulse 1s infinite; }
@keyframes chestPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.15)} }

/* ===== POWERUPS ===== */
.powerup-row { display: flex; gap: 10px; margin-top: 14px; }
.powerup-btn {
  background: rgba(255,255,255,0.08); border: 1px solid rgba(255,215,0,0.25);
  color: #fff; border-radius: 14px; padding: 10px 16px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  font-size: 11px; font-weight: 600; min-width: 76px; transition: background 0.2s;
}
.powerup-btn:active { background: rgba(255,215,0,0.18); }
.powerup-btn .pu-icon { font-size: 20px; }
.powerup-btn .pu-count { color: #ffd700; font-weight: 800; }

/* ===== BOTTOM NAV ===== */
.bottom-nav {
  display: flex; border-top: 1px solid rgba(255,215,0,0.12);
  background: rgba(10,0,0,0.7); flex-shrink: 0;
}
.nav-btn {
  flex: 1; background: none; border: none; color: #999;
  padding: 10px 2px 12px; cursor: pointer; display: flex;
  flex-direction: column; align-items: center; gap: 2px;
  font-size: 10px; font-weight: 600; transition: color 0.2s;
}
.nav-btn .nav-icon { font-size: 19px; }
.nav-btn.active { color: #ffd700; }
.nav-btn:active { color: #ffd700; }

/* ===== MODAL ===== */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.82);
  backdrop-filter: blur(5px); z-index: 100;
  display: none; justify-content: center; align-items: center; padding: 20px;
}
.modal-overlay.active { display: flex; }
.modal {
  background: linear-gradient(160deg, #1e1010, #0f0505);
  border: 1px solid rgba(255,215,0,0.35); border-radius: 22px;
  padding: 24px 20px; width: 100%; max-width: 400px;
  max-height: 88dvh; overflow-y: auto; position: relative;
  box-shadow: 0 20px 60px rgba(0,0,0,0.7), 0 0 40px rgba(255,215,0,0.08);
  animation: modalIn 0.25s ease-out;
}
@keyframes modalIn { from { transform: scale(0.92) translateY(15px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }
.modal-title { font-size: 21px; font-weight: 800; color: #ffd700; margin-bottom: 8px; text-align: center; }
.modal-desc { font-size: 13px; color: #ccc; margin-bottom: 16px; text-align: center; line-height: 1.5; white-space: pre-line; }
.modal-input {
  width: 100%; padding: 13px 14px; border-radius: 12px;
  border: 1px solid rgba(255,215,0,0.3); background: rgba(0,0,0,0.4);
  color: #fff; font-size: 15px; margin-bottom: 10px; outline: none;
  transition: border-color 0.2s;
}
.modal-input:focus { border-color: #ffd700; }
.modal-input.error { border-color: #ff4d4d; }
.modal-input.ok { border-color: #34d399; }
.error-msg { font-size: 12px; margin-bottom: 10px; min-height: 16px; font-weight: 600; }
.error-msg.err { color: #ff6b6b; }
.error-msg.ok { color: #34d399; }
.btn-row { display: flex; gap: 10px; margin-top: 12px; }
.btn-modal {
  flex: 1; padding: 13px; border-radius: 12px; border: none;
  font-size: 15px; font-weight: 700; cursor: pointer; transition: opacity 0.2s, transform 0.1s;
}
.btn-modal:active { transform: scale(0.97); }
.btn-modal.primary { background: linear-gradient(135deg, #ffd700, #ffb300); color: #1a0000; }
.btn-modal.primary:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-modal.secondary { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); }
.hp-field { position: absolute; left: -9999px; opacity: 0; height: 0; width: 0; }
#turnstile-container, #turnstile-wd-container { min-height: 65px; display: flex; justify-content: center; margin-bottom: 8px; }

/* ===== WD WALLET SELECT ===== */
.wallet-select { display: flex; gap: 8px; margin-bottom: 14px; justify-content: center; }
.wallet-opt {
  border-radius: 12px; padding: 8px 6px; background: rgba(255,255,255,0.05);
  border: 2px solid transparent; cursor: pointer; transition: all 0.2s;
  display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1;
}
.wallet-opt.selected { border-color: #ffd700; transform: scale(1.05); background: rgba(255,215,0,0.1); }
.wallet-opt svg { width: 64px; height: 28px; }

/* ===== WD CODE ===== */
.wd-code-box {
  background: #1a0a0a; border: 2px solid #ffd700; border-radius: 14px;
  padding: 16px; margin: 14px 0; font-family: 'Courier New', monospace;
  font-size: 13px; color: #ffd700; word-break: break-all; line-height: 1.6;
  text-align: center; box-shadow: 0 0 20px rgba(255,215,0,0.15) inset;
}
.progress-bar-outer { height: 8px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; margin: 10px 0; }
.progress-bar-inner { height: 100%; background: linear-gradient(90deg, #ffd700, #ffb300); transition: width 0.4s; border-radius: 10px; }

/* ===== TOAST ===== */
#toast-container { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 999; display: flex; flex-direction: column; gap: 8px; width: 90%; max-width: 400px; pointer-events: none; }
.toast {
  background: rgba(30,15,15,0.96); border: 1px solid rgba(255,215,0,0.4);
  color: #fff; padding: 12px 16px; border-radius: 14px; font-size: 13px;
  font-weight: 600; text-align: center; box-shadow: 0 8px 30px rgba(0,0,0,0.6);
  animation: toastIn 0.3s ease-out; backdrop-filter: blur(10px);
}
@keyframes toastIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.toast.out { animation: toastOut 0.3s ease-in forwards; }
@keyframes toastOut { to { transform: translateY(-20px); opacity: 0; } }

/* ===== SPIN WHEEL ===== */
.wheel {
  width: 200px; height: 200px; border-radius: 50%; margin: 20px auto;
  background: conic-gradient(#FF6B6B 0 60deg, #4ECDC4 60deg 120deg, #FFE66D 120deg 180deg, #A78BFA 180deg 240deg, #F472B6 240deg 300deg, #34D399 300deg 360deg);
  border: 5px solid #ffd700; box-shadow: 0 0 30px rgba(255,215,0,0.4);
  position: relative; transition: transform 4s cubic-bezier(0.17,0.67,0.12,0.99);
}
.wheel::after {
  content: '▼'; position: absolute; top: -18px; left: 50%; transform: translateX(-50%);
  font-size: 24px; color: #ffd700; filter: drop-shadow(0 0 6px #ffd700);
}

/* ===== CHECKIN ===== */
.checkin-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 14px 0; }
.checkin-day {
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,215,0,0.2);
  border-radius: 12px; padding: 10px 4px; text-align: center; font-size: 11px;
  display: flex; flex-direction: column; gap: 3px; align-items: center;
}
.checkin-day.claimed { background: rgba(52,211,153,0.15); border-color: #34d399; }
.checkin-day.today { border-color: #ffd700; box-shadow: 0 0 12px rgba(255,215,0,0.3); }
.checkin-day .day-num { font-weight: 800; color: #ffd700; }
.checkin-day .day-reward { color: #ffe066; font-size: 10px; }

/* ===== MISSION ===== */
.mission-item {
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,215,0,0.15);
  border-radius: 12px; padding: 12px; margin-bottom: 10px;
}
.mission-item .m-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.mission-item .m-name { font-size: 13px; font-weight: 600; }
.mission-item .m-reward { font-size: 12px; color: #ffd700; font-weight: 700; }
.mission-item .m-btn { padding: 6px 14px; border-radius: 8px; border: none; font-size: 12px; font-weight: 700; cursor: pointer; }
.mission-item .m-btn.claim { background: #ffd700; color: #1a0000; }
.mission-item .m-btn.claimed { background: rgba(255,255,255,0.15); color: #999; cursor: default; }

/* ===== LEADERBOARD ===== */
.lb-item {
  display: flex; align-items: center; gap: 12px; padding: 10px 12px;
  background: rgba(255,255,255,0.05); border-radius: 12px; margin-bottom: 8px;
  border: 1px solid rgba(255,215,0,0.1);
}
.lb-rank { font-size: 16px; font-weight: 800; width: 28px; text-align: center; }
.lb-rank.gold { color: #ffd700; }
.lb-rank.silver { color: #c0c0c0; }
.lb-rank.bronze { color: #cd7f32; }
.lb-name { flex: 1; font-size: 14px; font-weight: 600; }
.lb-score { font-size: 13px; color: #ffd700; font-weight: 700; }

/* ===== ADMIN ===== */
#screen-admin { background: #0f172a; padding: 0; }
.admin-header {
  background: #1e293b; padding: 14px 16px; display: flex;
  justify-content: space-between; align-items: center;
  border-bottom: 2px solid #06b6d4; flex-wrap: wrap; gap: 8px;
}
.admin-header h1 { font-size: 16px; color: #06b6d4; font-weight: 800; letter-spacing: 1px; }
.admin-header-btns { display: flex; gap: 6px; flex-wrap: wrap; }
.admin-btn {
  background: #06b6d4; color: #0f172a; border: none; padding: 7px 12px;
  border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer;
  transition: background 0.2s;
}
.admin-btn:hover { background: #22d3ee; }
.admin-btn.danger { background: #ef4444; color: #fff; }
.admin-btn.secondary { background: #334155; color: #fff; }
.admin-tabs { display: flex; background: #1e293b; border-bottom: 1px solid #334155; }
.admin-tab {
  flex: 1; padding: 12px; background: none; border: none; color: #94a3b8;
  font-size: 13px; font-weight: 600; cursor: pointer; border-bottom: 3px solid transparent;
  transition: all 0.2s;
}
.admin-tab.active { color: #06b6d4; border-bottom-color: #06b6d4; background: #0f172a; }
.admin-body { flex: 1; overflow-y: auto; padding: 16px; }
.admin-card {
  background: #1e293b; border: 1px solid #334155; border-radius: 12px;
  padding: 14px; margin-bottom: 12px;
}
.admin-card textarea {
  width: 100%; min-height: 100px; background: #0f172a; border: 1px solid #334155;
  border-radius: 8px; color: #e2e8f0; padding: 10px; font-family: monospace;
  font-size: 12px; resize: vertical; outline: none;
}
.admin-card textarea:focus { border-color: #06b6d4; }
.wd-item {
  background: #1e293b; border: 1px solid #334155; border-radius: 10px;
  padding: 12px; margin-bottom: 10px; font-size: 12px;
}
.wd-item .wd-row { display: flex; justify-content: space-between; margin-bottom: 4px; color: #cbd5e1; }
.wd-item .wd-code { font-family: monospace; font-size: 10px; color: #06b6d4; word-break: break-all; margin: 6px 0; background: #0f172a; padding: 6px; border-radius: 6px; }
.wd-item .wd-actions { display: flex; gap: 8px; margin-top: 8px; }
.wd-item .wd-actions button { flex: 1; padding: 7px; border: none; border-radius: 7px; font-size: 12px; font-weight: 700; cursor: pointer; }
.badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 10px; font-weight: 800; letter-spacing: 0.5px; }
.badge.pending { background: #fbbf24; color: #0f172a; }
.badge.done { background: #22c55e; color: #0f172a; }
.badge.rejected { background: #ef4444; color: #fff; }
.stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.stat-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 16px; text-align: center; }
.stat-card .stat-num { font-size: 26px; font-weight: 900; color: #06b6d4; }
.stat-card .stat-label { font-size: 11px; color: #94a3b8; margin-top: 4px; text-transform: uppercase; letter-spacing: 1px; }
.admin-login-box { max-width: 340px; margin: auto; padding: 30px 20px; text-align: center; }
.admin-login-box input { width: 100%; padding: 13px; border-radius: 10px; border: 1px solid #334155; background: #1e293b; color: #fff; font-size: 15px; margin-bottom: 12px; outline: none; }
.admin-login-box input:focus { border-color: #06b6d4; }
.filter-row { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; }
.filter-row input { flex: 1; padding: 8px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 12px; }

/* ===== GAME OVER ===== */
.gameover-icon { font-size: 56px; text-align: center; margin-bottom: 10px; }
.cooldown-text { font-size: 13px; color: #ffd700; text-align: center; margin: 10px 0; font-weight: 700; }

/* ===== AD SIM ===== */
.ad-countdown { font-size: 56px; font-weight: 900; color: #ffd700; text-align: center; margin: 20px 0; text-shadow: 0 0 30px rgba(255,215,0,0.5); }

.ad-progress-inner { height: 100%; background: linear-gradient(90deg, #ffd700, #ff8c00); width: 0%; transition: width 1s linear; }

/* ===== FLASH SALE ===== */
.flash-sale-box { background: linear-gradient(135deg, rgba(255,0,0,0.2), rgba(255,215,0,0.15)); border: 2px solid #ff4444; border-radius: 16px; padding: 18px; text-align: center; margin: 12px 0; }
.flash-timer { font-size: 32px; font-weight: 900; color: #ff4444; font-family: monospace; }

/* ===== SCROLLBAR ===== */

.mb-10 { margin-bottom: 10px; }
</style>

<div id="particles"></div>

<div class="arcade">

  <!-- ===== LOGIN SCREEN ===== -->
  <div id="screen-login" class="screen active">
    <svg class="login-logo" viewBox="0 0 100 100" fill="none">
      <circle cx="50" cy="50" r="44" fill="rgb(252,198,45)" stroke="#b8860b" stroke-width="3"/>

      <svg viewBox="0 0 100 100" fill="none">
        <circle cx="50" cy="50" r="44" fill="rgb(252,198,45)" stroke="#b8860b" stroke-width="3"/>
        <circle cx="50" cy="50" r="36" fill="none" stroke="#b8860b" stroke-width="2" stroke-dasharray="6 4"/>

    </button>

  </div>

  <!-- ===== GAME SCREEN ===== -->
  <div id="screen-game" class="screen">
    <div class="game-header">
      <div class="header-top">
        <div class="coin-display">
          <svg viewBox="0 0 100 100" fill="none">
            <circle cx="50" cy="50" r="44" fill="rgb(252,198,45)" stroke="#b8860b" stroke-width="3"/>
            <circle cx="50" cy="50" r="36" fill="none" stroke="#b8860b" stroke-width="2" stroke-dasharray="6 4"/>

  }, duration || 2800);
}
function vibrate(ms) {

function formatNumber(n) {
  return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
}
function copyToClipboard(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function() {
      showToast('📋 Kode berhasil disalin!');
    }).catch(function() { fallbackCopy(text); });
  } else { fallbackCopy(text); }
}
function fallbackCopy(text) {
  var ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); showToast('📋 Kode berhasil disalin!'); } catch(e) { showToast('❌ Gagal menyalin'); }
  document.body.removeChild(ta);
}
function djb2Hash(str) {
  var hash = 5381;
  for (var i = 0; i < str.length; i++) { hash = ((hash << 5) + hash) + str.charCodeAt(i); hash = hash & hash; }
  return Math.abs(hash).toString(36);
}
function randomHex(len) { var s = ''; for (var i = 0; i < len; i++) s += Math.floor(Math.random() * 16).toString(16); return s; }
function todayStr() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function formatTime(ms) {
  var s = Math.floor(ms / 1000), m = Math.floor(s / 60), h = Math.floor(m / 60);
  if (h > 0) return h + 'j ' + (m % 60) + 'm';
  if (m > 0) return m + 'm ' + (s % 60) + 'd';
  return s + 'd';
}

function getDeviceId() {
  var ua = navigator.userAgent || '';

  var screenInfo = (screen.width || 0) + 'x' + (screen.height || 0);
  var tz = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
  var hc = navigator.hardwareConcurrency || 0;
  var plat = navigator.platform || '';
  var dm = navigator.deviceMemory || 0;
  var raw = ua + '|' + lang + '|' + screenInfo + '|' + tz + '|' + hc + '|' + plat + '|' + dm;
  return 'dev_' + djb2Hash(raw).substring(0, 8);
}

function validateNickname(name) {
  if (!name || name.length < 3) return { ok: false, msg: 'Minimal 3 karakter' };
  if (name.length > 16) return { ok: false, msg: 'Maksimal 16 karakter' };
  if (!/^[a-zA-Z0-9_]+$/.test(name)) return { ok: false, msg: 'Hanya huruf, angka, underscore' };
  if (/^\d+$/.test(name)) return { ok: false, msg: 'Tidak boleh angka semua' };
  if (/(.)\1{3,}/.test(name)) return { ok: false, msg: 'Terlalu banyak karakter berulang' };
  if (/^bot/i.test(name)) return { ok: false, msg: 'Nama tidak diizinkan' };
  if (/^user\d+$/i.test(name)) return { ok: false, msg: 'Nama tidak diizinkan' };
  if (/^test\d+$/i.test(name)) return { ok: false, msg: 'Nama tidak diizinkan' };
  if (/^admin/i.test(name)) return { ok: false, msg: 'Nama tidak diizinkan' };
  if (/^null$/i.test(name)) return { ok: false, msg: 'Nama tidak diizinkan' };
  if (/^guest\d+$/i.test(name)) return { ok: false, msg: 'Nama tidak diizinkan' };
  return { ok: true, msg: 'Nama valid ✓' };
}
function generateReferral(name) {
  var prefix = name.replace(/[^a-zA-Z]/g, '').toUpperCase().substring(0, 4);
  while (prefix.length < 4) prefix += 'X';
  var suffix = '';
  var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  for (var i = 0; i < 4; i++) suffix += chars[Math.floor(Math.random() * chars.length)];
  return prefix + suffix;
}

function playTone(freq, duration, type) {
  if (!state.sfxOn || !state.audioCtx) return;
  try {
    var osc = state.audioCtx.createOscillator();
    var gain = state.audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.08, state.audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, state.audioCtx.currentTime + duration);
    osc.connect(gain); gain.connect(state.audioCtx.destination);
    osc.start(); osc.stop(state.audioCtx.currentTime + duration);
  } catch(e) {}
}

function updateHearts() {
  if (!state.player) return;
  var now = Date.now();
  var elapsed = now - state.player.lastHeartRegen;
  if (state.player.hearts < state.player.maxHearts) {
    var regen = Math.floor(elapsed / HEART_REGEN_MS);
    if (regen > 0) {
      state.player.hearts = Math.min(state.player.maxHearts, state.player.hearts + regen);
      state.player.lastHeartRegen = now;
      savePlayer();
    }
  }
  elapsed = now - state.player.lastTicketRegen;
  if (state.player.tickets < state.player.maxTickets) {
    var tregen = Math.floor(elapsed / TICKET_REGEN_MS);
    if (tregen > 0) {
      state.player.tickets = Math.min(state.player.maxTickets, state.player.tickets + tregen);
      state.player.lastTicketRegen = now;
      savePlayer();
    }
  }
}
function getVipLevel() {
  if (!state.player) return VIP_TIERS[0];
  var total = state.player.totalCoins || 0;
  var tier = VIP_TIERS[0];
  for (var i = 0; i < VIP_TIERS.length; i++) {
    if (total >= VIP_TIERS[i].min) tier = VIP_TIERS[i];
  }
  return tier;
}

    prefix: parts[0], name: parts[1], device: parts[2], amount: parseInt(parts[3]) || 0,

    var parseBtn = document.getElementById('admin-parse-btn');
    if (parseBtn) parseBtn.addEventListener('click', function() {

      data.pending.push(parsed);
      saveAdminData(data);
      showToast('✅ WD berhasil disimpan ke pending');

    });
  } else if (tab === 'pending') {
    if (data.pending.length === 0) {
      dom.adminBody.innerHTML = '<div class="admin-card text-center" style="color:#94a3b8;">Tidak ada WD pending</div>';
      return;
    }

   15. GAMEPLAY
   ============================================================ */
function initBoard() {
  state.board = [];
  for (var r = 0; r < BOARD_SIZE; r++) {
    state.board[r] = [];
    for (var c = 0; c < BOARD_SIZE; c++) {
      state.board[r][c] = { color: COLORS[Math.floor(Math.random() * COLORS.length)], chest: false };
    }
  }
  if (Math.random() < 0.15) {
    var cr = Math.floor(Math.random() * BOARD_SIZE);
    var cc = Math.floor(Math.random() * BOARD_SIZE);
    state.board[cr][cc].chest = true;
  }
  renderBoard();
}
function renderBoard() {
  if (!dom.board) return;
  dom.board.innerHTML = '';
  for (var r = 0; r < BOARD_SIZE; r++) {
    for (var c = 0; c < BOARD_SIZE; c++) {
      var cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.r = r; cell.dataset.c = c;
      var data = state.board[r][c];
      if (data) {
        cell.style.background = data.color;
        if (data.chest) cell.innerHTML = '<span class="chest-icon">🎁</span>';
      }
      cell.addEventListener('click', (function(row, col) {
        return function() { onCellClick(row, col); };
      })(r, c));
      dom.board.appendChild(cell);
    }
  }
}
function onCellClick(r, c) {
  if (state.boardLocked || state.gameOver) return;
  if (state.hammerMode) {
    state.hammerMode = false;
    if (state.player.hammer > 0) {
      state.player.hammer--;
      state.board[r][c] = null;
      sfxPop(); vibrate(30);
      renderBoard(); renderGameUI(); savePlayer();
      showToast('🔨 Blok dihancurkan!');
    }
    return;
  }
  var data = state.board[r][c];
  if (!data) return;
  if (data.chest) { openMysteryChest(r, c); return; }
  sfxClick();
  var group = findGroup(r, c, data.color);
  if (group.length >= 3) {
    state.boardLocked = true;
    clearGroup(group);
  }
}
function findGroup(r, c, color) {
  var visited = {};
  var group = [];
  var stack = [[r, c]];
  while (stack.length > 0) {
    var pos = stack.pop();
    var key = pos[0] + ',' + pos[1];
    if (visited[key]) continue;
    visited[key] = true;
    if (pos[0] < 0 || pos[0] >= BOARD_SIZE || pos[1] < 0 || pos[1] >= BOARD_SIZE) continue;
    var cell = state.board[pos[0]][pos[1]];
    if (!cell || cell.color !== color) continue;
    group.push(pos);
    stack.push([pos[0]-1, pos[1]]); stack.push([pos[0]+1, pos[1]]);
    stack.push([pos[0], pos[1]-1]); stack.push([pos[0], pos[1]+1]);
  }
  return group;
}
function clearGroup(group) {
  var count = group.length;
  var baseReward = count * 10;
  var vip = getVipLevel();
  var bonus = Math.floor(baseReward * vip.bonus);
  var totalReward = baseReward + bonus;
  state.player.coins += totalReward;
  state.player.totalCoins = (state.player.totalCoins || 0) + totalReward;
  if (state.player.missions && !state.player.missions.collectCoins.claimed) {
    state.player.missions.collectCoins.progress = Math.min(state.player.missions.collectCoins.target, state.player.missions.collectCoins.progress + totalReward);
  }
  if (state.player.missions && !state.player.missions.clearMatch.claimed) {
    state.player.missions.clearMatch.progress = Math.min(state.player.missions.clearMatch.target, state.player.missions.clearMatch.progress + 1);
  }
  savePlayer();
  sfxCoin(); vibrate(30);
  showFloatingReward(group[0][0], group[0][1], '+' + totalReward);
  group.forEach(function(pos) {
    var cell = dom.board.querySelector('[data-r="' + pos[0] + '"][data-c="' + pos[1] + '"]');
    if (cell) cell.classList.add('pop');
  });
  setTimeout(function() {
    group.forEach(function(pos) { state.board[pos[0]][pos[1]] = null; });
    applyGravity();
    renderBoard();
    renderGameUI();
    state.boardLocked = false;
    checkGameOver();
  }, 320);
}
function applyGravity() {
  for (var c = 0; c < BOARD_SIZE; c++) {
    var writeRow = BOARD_SIZE - 1;
    for (var r = BOARD_SIZE - 1; r >= 0; r--) {
      if (state.board[r][c]) {
        state.board[writeRow][c] = state.board[r][c];
        if (writeRow !== r) state.board[r][c] = null;
        writeRow--;
      }
    }
    for (var r2 = writeRow; r2 >= 0; r2--) {
      state.board[r2][c] = { color: COLORS[Math.floor(Math.random() * COLORS.length)], chest: false };
    }
  }
}
function checkGameOver() {
  if (!state.player) return;
  var hasMove = false;
  for (var r = 0; r < BOARD_SIZE && !hasMove; r++) {
    for (var c = 0; c < BOARD_SIZE && !hasMove; c++) {
      if (!state.board[r][c]) continue;
      var g = findGroup(r, c, state.board[r][c].color);
      if (g.length >= 3) hasMove = true;
    }
  }
  if (!hasMove) {
    state.player.hearts--;
    savePlayer();
    renderGameUI();
    if (state.player.hearts <= 0) { showGameOver(); }
    else { showToast('❤️ Tidak ada langkah! Hati -1'); initBoard(); }
  }
}
function showFloatingReward(r, c, text) {
  var cell = dom.board.querySelector('[data-r="' + r + '"][data-c="' + c + '"]');
  if (!cell) return;
  var float = document.createElement('div');
  float.textContent = text;
  float.style.cssText = 'position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); color:#ffd700; font-weight:900; font-size:16px; pointer-events:none; z-index:50; animation:floatReward 0.8s ease-out forwards;';
  var wrap = cell.closest('.board-wrap');
  if (wrap) { wrap.style.position = 'relative'; wrap.appendChild(float); setTimeout(function(){ if (float.parentNode) float.parentNode.removeChild(float); }, 800); }
}
function showGameOver() {
  state.gameOver = true;
  var adUsed = state.player.reviveAdUsedToday && state.player.lastAdDate === todayStr();
  var cooldownRemain = Math.max(0, state.player.reviveCooldownUntil - Date.now());
  var html = '<div class="gameover-icon">💔</div><div class="modal-title">Game Over!</div><div class="modal-desc">Hati kamu habis. Pilih cara revive:</div>';
  if (!adUsed) html += '<button class="btn-modal primary" id="revive-ad" style="width:100%; margin-bottom:10px;">🎬 Tonton Iklan → +1 Hati</button>';
  else html += '<div class="cooldown-text">🎬 Iklan revive sudah dipakai hari ini</div>';
  if (cooldownRemain <= 0) html += '<button class="btn-modal secondary" id="revive-cooldown" style="width:100%; margin-bottom:10px;">⏳ Tunggu 60 detik → +1 Hati</button>';
  else html += '<div class="cooldown-text">⏳ Cooldown revive: ' + Math.ceil(cooldownRemain/1000) + ' detik</div>';
  html += '<button class="btn-modal secondary" id="gameover-close" style="width:100%;">Tutup</button>';
  showModal(html, 'gameover');
  var adBtn = document.getElementById('revive-ad');
  if (adBtn) adBtn.addEventListener('click', function() {
    showAdSim(function() {
      state.player.hearts = 1;
      state.player.reviveAdUsedToday = true;
      state.player.lastAdDate = todayStr();
      savePlayer(); state.gameOver = false; closeModal(); renderGameUI();
      showToast('❤️ +1 Hati dari iklan!');
      initBoard();
    });
  });
  var cdBtn = document.getElementById('revive-cooldown');
  if (cdBtn) cdBtn.addEventListener('click', function() {
    state.player.reviveCooldownUntil = Date.now() + 60000;
    savePlayer(); closeModal();
    showToast('⏳ Tunggu 60 detik untuk revive...');
    setTimeout(function() {
      if (state.gameOver) {
        state.player.hearts = 1; savePlayer(); state.gameOver = false;
        renderGameUI(); showToast('❤️ +1 Hati dari cooldown!'); initBoard();
      }
    }, 60000);
  });
  var closeBtn = document.getElementById('gameover-close');
  if (closeBtn) closeBtn.addEventListener('click', function() { closeModal(); });
}

function showModal(html, type) {

  dom.modalOverlay.dataset.type = type || '';
}
function closeModal() {
  if (dom.modalOverlay) dom.modalOverlay.classList.remove('active');
}
function showAdSim(callback) {
  if (!state.player || state.player.tickets <= 0) { showToast('❌ Tiket iklan habis!'); return; }
  state.player.tickets--;

  var count = 5;

    count--;

  html += '<div class="progress-bar-outer"><div class="progress-bar-inner" id="wd-progress" style="width:0%"></div></div>';
  html += '<div class="btn-row"><button class="btn-modal primary" id="wd-submit" disabled>Ajukan WD</button><button class="btn-modal secondary" onclick="closeModal()">Batal</button></div>';
  showModal(html, 'wd');
  var selectedWallet = 'DANA';
  document.querySelectorAll('.wallet-opt').forEach(function(el) {
    el.addEventListener('click', function() {
      document.querySelectorAll('.wallet-opt').forEach(function(e) { e.classList.remove('selected'); });
      this.classList.add('selected');
      selectedWallet = this.getAttribute('data-wallet');
      state.selectedWallet = selectedWallet;
      sfxClick();
    });
  });
  resetTurnstile('turnstile-wd-container');
  renderTurnstileWidget('turnstile-wd-container', function(token) {
    state.turnstileWdToken = token;
    updateWdButton();
  });
  var phoneInput = document.getElementById('wd-phone');
  function updateWdButton() {
    var phone = phoneInput ? phoneInput.value.replace(/\D/g, '') : '';
    var validPhone = phone.length >= 10 && phone.length <= 14;
    var progress = Math.min(100, Math.floor((coins / MIN_WD) * 100));
    var bar = document.getElementById('wd-progress');
    if (bar) bar.style.width = progress + '%';
    var submitBtn = document.getElementById('wd-submit');
    if (submitBtn) submitBtn.disabled = !(canWd && validPhone && (state.turnstileWdToken || state.turnstileWdBypassed));
  }
  if (phoneInput) phoneInput.addEventListener('input', updateWdButton);
  updateWdButton();
  var submitBtn = document.getElementById('wd-submit');
  if (submitBtn) submitBtn.addEventListener('click', function() {
    var phone = phoneInput ? phoneInput.value.replace(/\D/g, '') : '';
    if (phone.length < 10 || phone.length > 14) { showToast('❌ Nomor HP tidak valid'); return; }
    if (state.player.coins < MIN_WD) { showToast('❌ Saldo tidak cukup'); return; }
    var amount = state.player.coins;
    state.player.coins = 0;
    state.player.wdCooldownUntil = Date.now() + 2 * 60 * 60 * 1000;
    var ts = Date.now().toString(36);
    var code = 'CB|' + state.player.name + '|' + state.deviceId.substring(0, 6) + '|' + amount + '|' + selectedWallet + '|' + phone + '|' + state.player.referral + '|' + ts;
    try {
      var pending = JSON.parse(localStorage.getItem(WD_PENDING_KEY) || '[]');
      pending.push({ code: code, amount: amount, time: Date.now() });
      localStorage.setItem(WD_PENDING_KEY, JSON.stringify(pending));
    } catch(e) {}
    savePlayer(); renderGameUI(); closeModal();
    console.log('[WD] Kode dibuat:', code);
    showModal('<div class="modal-title">✅ WD Diterima</div><div class="modal-desc">Salin kode di bawah dan kirim ke admin via IG/TikTok/WA. Admin proses 1x24 jam.</div><div class="wd-code-box" id="wd-code-box">' + code + '</div><button class="btn-modal primary" style="width:100%;" id="wd-copy-btn">📋 Copy Kode</button><button class="btn-modal secondary" style="width:100%; margin-top:8px;" onclick="closeModal()">Tutup</button>', 'wd-done');
    var copyBtn = document.getElementById('wd-copy-btn');
    if (copyBtn) copyBtn.addEventListener('click', function() { copyToClipboard(code); });
  });
}
function openMysteryChest(r, c) {
  if (state.player.lastMysteryChestDate === todayStr()) { showToast('🎁 Chest sudah dibuka hari ini'); state.board[r][c].chest = false; renderBoard(); return; }
  state.player.lastMysteryChestDate = todayStr();
  var rewards = ['coin', 'ticket', 'hammer', 'shuffle'];
  var pick = rewards[Math.floor(Math.random() * rewards.length)];
  var msg = '';
  if (pick === 'coin') { var amt = Math.floor(Math.random() * 500) + 100; state.player.coins += amt; msg = '💰 +' + amt + ' koin!'; }
  else if (pick === 'ticket') { state.player.tickets = Math.min(state.player.maxTickets, state.player.tickets + 1); msg = '🎬 +1 tiket iklan!'; }
  else if (pick === 'hammer') { state.player.hammer++; msg = '🔨 +1 Hammer!'; }
  else { state.player.shuffle++; msg = '🔀 +1 Shuffle!'; }
  state.board[r][c].chest = false;
  savePlayer(); renderGameUI(); sfxWin();
  showModal('<div class="modal-title">🎁 Mystery Chest</div><div class="modal-desc">Kamu mendapat:</div><div style="font-size:28px; text-align:center; margin:20px 0; color:#ffd700; font-weight:900;">' + msg + '</div><button class="btn-modal primary" style="width:100%;" onclick="closeModal()">OK</button>', 'chest');
  renderBoard();
}
function checkFlashSale() {
  var now = Date.now();
  if (state.flashSaleActive && now > state.flashSaleEnd) { state.flashSaleActive = false; }
  if (!state.flashSaleActive && now - state.flashSaleLastAppear > 30 * 60 * 1000 && Math.random() < 0.3) {
    state.flashSaleActive = true;
    state.flashSaleEnd = now + 5 * 60 * 1000;
    state.flashSaleLastAppear = now;
    showFlashSale();
  }
}
function showFlashSale() {
  var html = '<div class="modal-title">⚡ FLASH SALE!</div><div class="flash-sale-box"><div class="flash-timer" id="flash-timer">05:00</div><div class="flash-price">Beli 5.000 koin cuma <strong>2.500 koin</strong>! <s>5.000</s></div></div><button class="btn-modal primary" style="width:100%;" id="flash-buy">Beli Sekarang</button><button class="btn-modal secondary" style="width:100%; margin-top:8px;" onclick="closeModal()">Tutup</button>';
  showModal(html, 'flash');
  var timer = setInterval(function() {
    var remain = Math.max(0, state.flashSaleEnd - Date.now());
    var el = document.getElementById('flash-timer');
    if (el) el.textContent = Math.floor(remain / 60000) + ':' + String(Math.floor((remain % 60000) / 1000)).padStart(2, '0');
    if (remain <= 0) { clearInterval(timer); closeModal(); state.flashSaleActive = false; }
  }, 1000);
  var buyBtn = document.getElementById('flash-buy');
  if (buyBtn) buyBtn.addEventListener('click', function() {
    if (state.player.coins < 2500) { showToast('❌ Koin tidak cukup'); return; }
    state.player.coins -= 2500;
    state.player.coins += 5000;
    state.player.totalCoins = (state.player.totalCoins || 0) + 5000;
    savePlayer(); renderGameUI(); closeModal();
    showToast('⚡ Flash sale berhasil! +5.000 koin');
  });
}
function showTicker() {
  var now = Date.now();
  if (now - state.lastTickerTime < 30000) return;
  state.lastTickerTime = now;
  var name = BOT_NAMES[Math.floor(Math.random() * BOT_NAMES.length)];
  var amt = [50000, 100000, 250000, 500000][Math.floor(Math.random() * 4)];
  var masked = name.substring(0, 4) + '***';
  if (dom.tickerText) dom.tickerText.textContent = masked + ' baru saja WD ' + formatNumber(amt) + ' koin!';
  if (dom.ticker) {
    dom.ticker.classList.add('show');
    setTimeout(function() { dom.ticker.classList.remove('show'); }, 3000);
  }
}

/* ============================================================
   17. NAVIGATION
   ============================================================ */
function showScreen(name) {
  state.screen = name;
  if (dom.screenLogin) dom.screenLogin.classList.toggle('active', name === 'login');
  if (dom.screenGame) dom.screenGame.classList.toggle('active', name === 'game');
  if (dom.screenAdmin) dom.screenAdmin.classList.toggle('active', name === 'admin');
}

/* ============================================================
   18. EVENT LISTENERS
   ============================================================ */
function setupEventListeners() {
  // START BUTTON
  if (dom.btnStart) {
    dom.btnStart.addEventListener('click', function() {
      initAudio(); sfxClick();
      var html = '<div class="modal-title">🎮 Pilih Nama Player</div><div class="modal-desc">Masukkan nama kamu (3-16 karakter, huruf/angka/underscore):</div><input class="modal-input" id="name_input" maxlength="16" placeholder="Contoh: SultanCuan" autocomplete="off"><input class="hp-field" id="hp_field" tabindex="-1" autocomplete="off"><div class="error-msg" id="name_error"></div><div id="turnstile-container"></div><div class="btn-row"><button class="btn-modal primary" id="name-submit" disabled>Mulai Main</button><button class="btn-modal secondary" onclick="closeModal()">Batal</button></div>';
      showModal(html, 'name');
      var nameInput = document.getElementById('name_input');
      var nameError = document.getElementById('name_error');
      var submitBtn = document.getElementById('name-submit');
      var hpField = document.getElementById('hp_field');
      var formOpenTime = Date.now();
      resetTurnstile('turnstile-container');
      renderTurnstileWidget('turnstile-container', function(token) {
        state.turnstileToken = token;
        updateSubmit();
      });
      function updateSubmit() {
        var name = nameInput ? nameInput.value.trim() : '';
        var v = validateNickname(name);
        if (nameError) { nameError.textContent = v.msg; nameError.className = 'error-msg ' + (v.ok && name ? 'ok' : v.ok ? '' : 'err'); }
        if (nameInput) nameInput.className = 'modal-input ' + (name ? (v.ok ? 'ok' : 'error') : '');
        var canSubmit = v.ok && (state.turnstileToken || state.turnstileBypassed) && name.length > 0;
        if (submitBtn) submitBtn.disabled = !canSubmit;
      }
      if (nameInput) nameInput.addEventListener('input', updateSubmit);
      updateSubmit();
      if (submitBtn) submitBtn.addEventListener('click', function() {
        // Honeypot check
        if (hpField && hpField.value.trim() !== '') {
          state.honeypotTrips++;
          showToast('🚫 Bot terdeteksi!');
          if (state.honeypotTrips >= 3) { state.shadowbanned = true; showToast('🚫 Akun dibatasi 7 hari'); }
          closeModal(); return;
        }
        // Time check
        if (Date.now() - formOpenTime < 800) { showToast('⏳ Terlalu cepat, tunggu sebentar'); return; }
        var name = nameInput ? nameInput.value.trim() : '';
        var v = validateNickname(name);
        if (!v.ok) { showToast('❌ ' + v.msg); return; }
        if (!canCreateAccount()) { showToast('❌ Maks 3 akun per device per 24 jam'); return; }
        initAudio(); sfxWin();
        state.deviceId = getDeviceId();
        console.log('[Device] ID:', state.deviceId);
        saveDeviceAccount(name);
        createPlayer(name);
        closeModal();
        showScreen('game');
        initBoard();
        renderGameUI();
        showToast('🎉 Selamat datang, ' + name + '!');
        if (state.player.missions && !state.player.missions.playGame.claimed) {
          state.player.missions.playGame.progress = 1;
        }
        savePlayer();
      });
    });
  }

  // BGM & SFX
  if (dom.btnBgm) dom.btnBgm.addEventListener('click', function() {
    initAudio(); state.bgmOn = !state.bgmOn; saveSettings();
    this.textContent = state.bgmOn ? '🎵 ON' : '🎵 OFF';
    showToast(state.bgmOn ? '🎵 BGM aktif' : '🎵 BGM mati');
  });
  if (dom.btnSfx) dom.btnSfx.addEventListener('click', function() {
    initAudio(); state.sfxOn = !state.sfxOn; saveSettings();
    this.textContent = state.sfxOn ? '🔊 ON' : '🔊 OFF';
    sfxClick();
    showToast(state.sfxOn ? '🔊 SFX aktif' : '🔊 SFX mati');
  });

  // POWERUPS
  if (dom.btnHammer) dom.btnHammer.addEventListener('click', function() {
    if (state.player.hammer <= 0) { showToast('❌ Hammer habis, beli dulu!'); return; }
    state.hammerMode = !state.hammerMode;
    showToast(state.hammerMode ? '🔨 Pilih blok yang ingin dihancurkan' : '🔨 Hammer dibatalkan');
  });
  if (dom.btnShuffle) dom.btnShuffle.addEventListener('click', function() {
    if (state.player.shuffle <= 0) { showToast('❌ Shuffle habis, beli dulu!'); return; }
    state.player.shuffle--;
    savePlayer(); renderGameUI(); sfxPop();
    initBoard();
    showToast('🔀 Board diacak!');
  });
  if (dom.btnBuyPowerup) dom.btnBuyPowerup.addEventListener('click', function() {
    if (state.player.coins < POWERUP_COST) { showToast('❌ Koin tidak cukup (butuh 500)'); return; }
    state.player.coins -= POWERUP_COST;
    state.player.hammer++;
    state.player.shuffle++;
    savePlayer(); renderGameUI(); sfxCoin();
    showToast('💰 +1 Hammer & +1 Shuffle!');
  });

  // BOTTOM NAV
  document.querySelectorAll('.nav-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var nav = this.getAttribute('data-nav');
      document.querySelectorAll('.nav-btn').forEach(function(b) { b.classList.remove('active'); });
      this.classList.add('active');
      initAudio(); sfxClick();
      if (nav === 'game') { /* already on game */ }
      else if (nav === 'spin') openSpin();
      else if (nav === 'checkin') openCheckin();
      else if (nav === 'ranking') openRanking();
      else if (nav === 'wd') openWd();
      else if (nav === 'missions') openMissions();
    });
  });

  // MODAL CLOSE ON OVERLAY
  if (dom.modalOverlay) {
    dom.modalOverlay.addEventListener('click', function(e) {
      if (e.target === dom.modalOverlay) closeModal();
    });
  }

  // ADMIN LOGIN
  if (dom.adminLoginBtn) dom.adminLoginBtn.addEventListener('click', function() {
    var pass = dom.adminPass ? dom.adminPass.value : '';
    adminLogin(pass);
  });
  if (dom.adminPass) dom.adminPass.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { adminLogin(this.value); }
  });
  if (dom.adminLogout) dom.adminLogout.addEventListener('click', function() {
    state.adminAuthed = false; renderAdmin(); showToast('🔐 Logout admin');
  });
  if (dom.adminExport) dom.adminExport.addEventListener('click', function() {
    var data = loadAdminData();
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    var d = new Date();
    a.download = 'cuanblok-admin-' + d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0') + '.json';
    a.click(); URL.revokeObjectURL(a.href);
    showToast('📥 Export berhasil');
  });
  if (dom.adminImportBtn) dom.adminImportBtn.addEventListener('click', function() { dom.adminImportFile.click(); });
  if (dom.adminImportFile) dom.adminImportFile.addEventListener('change', function() {
    var file = this.files[0]; if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e) {
      try {
        var data = JSON.parse(e.target.result);
        if (data.pending && data.done) { saveAdminData(data); renderAdminBody(); showToast('📤 Import berhasil'); }
        else showToast('❌ Format file tidak valid');
      } catch(err) { showToast('❌ Gagal import: ' + err.message); }
    };
    reader.readAsText(file);
  });
  document.querySelectorAll('.admin-tab').forEach(function(tab) {
    tab.addEventListener('click', function() {
      document.querySelectorAll('.admin-tab').forEach(function(t) { t.classList.remove('active'); });
      this.classList.add('active');
      state.adminTab = this.getAttribute('data-tab');
      renderAdminBody();
    });
  });

  // EXIT INTENT
  document.addEventListener('mouseleave', function(e) {
    if (e.clientY <= 0 && !state.exitIntentShown && state.screen === 'game') {
      state.exitIntentShown = true;
      showModal('<div class="modal-title">👋 Yakin mau keluar?</div><div class="modal-desc">Dapatkan +500 koin gratis jika tetap di sini!</div><button class="btn-modal primary" style="width:100%;" id="exit-stay">💵 Ambil 500 Koin</button><button class="btn-modal secondary" style="width:100%; margin-top:8px;" onclick="closeModal()">Keluar</button>', 'exit');
      var stayBtn = document.getElementById('exit-stay');
      if (stayBtn) stayBtn.addEventListener('click', function() {
        state.player.coins += 500;
        state.player.totalCoins = (state.player.totalCoins || 0) + 500;
        savePlayer(); renderGameUI(); closeModal();
        showToast('💵 +500 koin!');
      });
    }
  });

  // VISIBILITY
  document.addEventListener('visibilitychange', function() {
    if (!document.hidden) { updateHearts(); renderGameUI(); }
  });
}

/* ============================================================
   19. INIT
   ============================================================ */
function init() {
  console.log('[Init] Mulai...');
  cacheDom();
  loadSettings();
  state.deviceId = getDeviceId();
  console.log('[Device] ID:', state.deviceId);

  // Particles
  if (dom.particles) {
    for (var i = 0; i < 30; i++) {
      var p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + '%';
      p.style.animationDuration = (Math.random() * 6 + 6) + 's';
      p.style.animationDelay = (Math.random() * 8) + 's';
      p.style.width = p.style.height = (Math.random() * 4 + 3) + 'px';
      dom.particles.appendChild(p);
    }
  }

  // Hash detection
  if (window.location.hash === ADMIN_HASH) {
    state.isAdmin = true;
    showScreen('admin');
    renderAdmin();
    console.log('[Mode] Admin mode');
  } else if (loadPlayer()) {
    console.log('[Mode] Player mode (existing)');
    showScreen('game');
    if (!state.board.length) initBoard();
    renderGameUI();
  } else {
    console.log('[Mode] Player mode');
    showScreen('login');
  }

  setupEventListeners();

  // Auto save & timers
  setInterval(function() {
    if (state.player && state.screen === 'game') {
      updateHearts(); renderGameUI(); checkFlashSale();
    }
  }, 10000);

  setInterval(function() { if (state.screen === 'game') showTicker(); }, 30000);

  // Expose
  window.CuanBlok = { state: state, updateUI: renderGameUI, showToast: showToast, closeModal: closeModal };
  console.log('[Init] Selesai');
}

// Global functions for onclick
window.closeModal = closeModal;

// Start
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

</script>

}
